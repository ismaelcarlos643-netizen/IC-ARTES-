<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartazes de Oferta estilo Cartaz Fácil</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-app: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--bg-app);
            display: flex;
            height: 100vh;
        }

        /* Painel de Controle Lateral */
        .control-panel {
            width: 350px;
            background: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .control-panel h2 {
            font-size: 1.2rem;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #475569;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-print {
            background-color: #22c55e;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-print:hover {
            background-color: #16a34a;
        }

        /* Área de Visualização do Cartaz */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        /* Estrutura Base do Cartaz Dinâmico */
        .poster-canvas {
            background-color: #ffcc00;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4%;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Tamanhos Suportados */
        .size-a4 { width: 595px; height: 842px; }
        .size-a3 { width: 842px; height: 1191px; font-size: 1.4rem; }
        .size-a5 { width: 420px; height: 595px; font-size: 0.8rem; }

        /* Elementos Internos Estilo Supermercado */
        .poster-header {
            width: 100%;
            text-align: center;
            background: #cc0000;
            color: white;
            padding: 15px;
            font-size: 2.5em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 8px;
            text-shadow: 2px 2px 0px #000;
        }

        .poster-body {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0;
        }

        .product-title {
            font-size: 3em;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .product-desc {
            font-size: 1.4em;
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
        }

        .poster-footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            color: #cc0000;
            font-weight: 900;
        }

        .currency {
            font-size: 2.5em;
            margin-right: 5px;
        }

        .price-main {
            font-size: 7.5em;
            line-height: 0.9;
            letter-spacing: -3px;
        }

        .price-cents {
            font-size: 3.5em;
            align-self: flex-start;
            margin-top: 10px;
            text-decoration: underline;
        }

        /* --- TEMAS VISUAIS CUSTOMIZADOS --- */
        /* Tema Black Friday */
        .theme-black { background-color: #111111; }
        .theme-black .poster-header { background: #ffcc00; color: #000; text-shadow: none; }
        .theme-black .product-title { color: #ffffff; }
        .theme-black .product-desc { color: #aaaaaa; }
        .theme-black .price-container { color: #ff0000; }

        /* Tema Hortifrúti */
        .theme-green { background-color: #f0fdf4; border: 15px solid #16a34a; }
        .theme-green .poster-header { background: #16a34a; color: white; text-shadow: none; }
        .theme-green .product-title { color: #14532d; }
        .theme-green .price-container { color: #dc2626; }

        /* Regras de Impressão (Garante que apenas o cartaz saia na folha inteira) */
        @media print {
            body { background: white; }
            .control-panel { display: none !important; }
            .preview-area { padding: 0; overflow: visible; }
            .poster-canvas {
                box-shadow: none;
                margin: 0;
                width: 100vw;
                height: 100vh;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <!-- Painel de Controle -->
    <div class="control-panel">
        <h2>Gerador de Cartazes</h2>
        
        <div class="form-group">
            <label for="input-theme">Tema Visual</label>
            <select id="input-theme" oninput="updatePoster()">
                <option value="default">Oferta Tradicional (Amarelo/Vermelho)</option>
                <option value="theme-black">Black Friday (Preto/Neon)</option>
                <option value="theme-green">Hortifrúti / Saudável (Verde)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-size">Tamanho do Cartaz</label>
            <select id="input-size" oninput="updatePoster()">
                <option value="size-a4">A4 (Padrão)</option>
                <option value="size-a3">A3 (Grande para Vitrine)</option>
                <option value="size-a5">A5 (Pequeno para Gôndola)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-badge">Texto do Cabeçalho</label>
            <input type="text" id="input-badge" value="OFERTA" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-title">Nome do Produto</label>
            <input type="text" id="input-title" value="Arroz Agulhinha T1 5kg" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-desc">Detalhes / Subtítulo</label>
            <input type="text" id="input-desc" value="Limite de 3 unidades por cliente" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-price">Preço Inteiro</label>
            <input type="number" id="input-price" value="24" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-cents">Centavos</label>
            <input type="text" id="input-cents" value="98" maxlength="2" oninput="updatePoster()">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Cartaz</button>
    </div>

    <!-- Área de Visualização do Resultado -->
    <div class="preview-area">
        <div id="poster" class="poster-canvas size-a4">
            <div id="view-badge" class="poster-header">Oferta</div>
            
            <div class="poster-body">
                <div id="view-title" class="product-title">Arroz Agulhinha T1 5kg</div>
                <div id="view-desc" class="product-desc">Limite de 3 unidades por cliente</div>
            </div>
            
            <div class="poster-footer">
                <div class="price-container">
                    <span class="currency">R$</span>
                    <span id="view-price" class="price-main">24</span>
                    <span id="view-cents" class="price-cents">,98</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Função que atualiza o layout em tempo real conforme o usuário digita
        function updatePoster() {
            // Inputs
            const theme = document.getElementById('input-theme').value;
            const size = document.getElementById('input-size').value;
            const badge = document.getElementById('input-badge').value;
            const title = document.getElementById('input-title').value;
            const desc = document.getElementById('input-desc').value;
            const price = document.getElementById('input-price').value;
            const cents = document.getElementById('input-cents').value;

            // Elementos de Visualização
            const poster = document.getElementById('poster');
            
            // Atualiza tamanho e classes de tema do elemento pai
            poster.className = 'poster-canvas ' + size + ' ' + (theme !== 'default' ? theme : '');

            // Atualiza os textos
            document.getElementById('view-badge').innerText = badge;
            document.getElementById('view-title').innerText = title;
            document.getElementById('view-desc').innerText = desc;
            document.getElementById('view-price').innerText = price;
            document.getElementById('view-cents').innerText = ',' + cents;
        }

        // Inicializa o cartaz com os valores padrões no carregamento
        updatePoster();
    </script>
</body>
</html>
