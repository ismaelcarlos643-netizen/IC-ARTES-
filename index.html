<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cartazista Pro - IC ARTES</title>
    <script src="https://cloudflare.com"></script>
    <style>
        /* CONFIGURAÇÕES DO PAINEL LATERAL (SaaS) */
        * { box-sizing: border-box; font-family: 'Arial Black', Gadget, sans-serif; }
        body { margin: 0; background-color: #1e1e2f; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } }
        
        .sidebar { width: 380px; background-color: #26263f; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.3); z-index: 10; font-family: system-ui, sans-serif; }
        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; overflow: visible; } }
        
        .main-content { flex: 1; background-color: #13131f; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; min-height: 100vh; }
        
        h2 { font-size: 18px; margin-top: 0; color: #00ffcc; border-bottom: 2px solid #3d3d5c; padding-bottom: 10px; font-family: system-ui, sans-serif; text-transform: uppercase; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a2a2c2; margin-bottom: 5px; font-weight: 600; font-family: system-ui, sans-serif; }
        input, select { width: 100%; padding: 10px; background-color: #31314f; border: 1px solid #4e4e75; border-radius: 6px; color: #fff; font-size: 15px; outline: none; font-family: system-ui, sans-serif; }
        input:focus, select:focus { border-color: #00ffcc; }
        .row { display: flex; gap: 10px; }
        
        .btn-print { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 15px; text-transform: uppercase; }
        .btn-save { background: linear-gradient(135deg, #ffcc00, #ffaa00); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 10px; text-transform: uppercase; }
        .lista-produtos-panel { border-top: 2px dashed #4e4e75; margin-top: 15px; padding-top: 15px; display: none; }
        .sub-titulo-lista { color: #ffcc00; font-size: 14px; margin-bottom: 10px; font-family: system-ui, sans-serif; font-weight: bold; }

        /* PREVISÃO DA FOLHA */
        .paper-preview { background-color: #fff; display: block; }
        
        /* TAMANHOS DE PAPEL */
        .A4 { width: 210mm; height: 297mm; }
        .A5 { width: 148mm; height: 210mm; }
        .tam-11x15 { width: 110mm; height: 150mm; }
        .tam-20x27 { width: 200mm; height: 270mm; }

        /* MODO MULTI-CARTAZ 4 POR FOLHA */
        .grid-4 { width: 210mm; height: 297mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; background: #fff; }
        .grid-4 .cartaz-container { width: 100% !important; height: 100% !important; page-break-inside: avoid; border: 1px dashed #ccc !important; }
        
        /* NOVO DESIGN DO CARTAZ IGUAL AO MODELO DO CLIENTE */
        .cartaz-container { 
            width: 100%; 
            height: 100%; 
            background-color: #fff; 
            color: #000; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 0; 
            box-sizing: border-box; 
            position: relative; 
            overflow: hidden;
            border: 5px solid currentColor;
        }
        
        /* FAIXA DO TOPO ONDULADA */
        .faixa-topo {
            width: 100%;
            height: 18%;
            background-color: currentColor;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
        }
        .badge-topo { 
            font-size: 55px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #fff;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }
        
        /* CONTEÚDO CENTRALIZADO SOBRE O FUNDO AMARELO PINCELADO */
        .conteudo-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 10px 20px;
            background: radial-gradient(circle, #ffe600 60%, #ffffff 100%);
        }

        .product-image-top { 
            height: 80px; 
            display: none;
            justify-content: center; 
            align-items: center; 
        }
        .product-image-top img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .product-title { 
            font-size: 42px; 
            font-weight: 900; 
            text-align: center; 
            text-transform: uppercase; 
            color: #000; 
            line-height: 1.0;
            margin: 5px 0;
            text-shadow: 1px 1px 0px #fff;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* SEÇÃO DE PREÇOS */
        .price-section { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
        }
        .price-old { font-size: 22px; color: #333; text-decoration: line-through; font-weight: bold; margin-bottom: -5px; display: none; }
        .price-main { color: currentColor; font-weight: 900; display: flex; align-items: flex-start; justify-content: center; line-height: 0.75; }
        .rs { font-size: 50px; margin-top: 25px; font-weight: 900; margin-right: 3px; }
        .inteiro { font-size: 210px; letter-spacing: -10px; }
        .centavos { font-size: 95px; margin-top: 25px; font-weight: 900; line-height: 0.7; margin-left: 2px; }
        .unidade-medida { font-size: 24px; color: #000; font-weight: 900; background-color: #ffe600; padding: 2px 6px; border-radius: 4px; margin-top: -10px; text-transform: uppercase; }
        
        .clube-tag { position: absolute; bottom: 25%; right: 10px; background-color: #000; color: #fff; padding: 5px 8px; font-weight: 900; border-radius: 4px; font-size: 12px; text-transform: uppercase; display: none; transform: rotate(-5deg); }

        /* FAIXA DO RODAPÉ */
        .faixa-rodape {
            width: 100%;
            height: 10%;
            background-color: currentColor;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0 20%, 50% 0, 100% 20%, 100% 100%, 0 100%);
            padding-top: 8px;
        }
        .texto-rodape {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* CONFIGURAÇÕES REDUZIDAS PARA O MODO LISTA (4 POR FOLHA) */
        .grid-4 .badge-topo { font-size: 24px; }
        .grid-4 .faixa-topo { height: 16%; }
        .grid-4 .product-image-top { height: 35px; }
        .grid-4 .product-title { font-size: 18px; margin: 2px 0; }
        .grid-4 .rs { font-size: 20px; margin-top: 8px; }
        .grid-4 .inteiro { font-size: 85px; letter-spacing: -4px; }
        .grid-4 .centavos { font-size: 40px; margin-top: 8px; }
        .grid-4 .unidade-medida { font-size: 11px; margin-top: -2px; padding: 1px 4px; }
        .grid-4 .price-old { font-size: 12px; }
        .grid-4 .clube-tag { font-size: 7px; bottom: 20%; }
        .grid-4 .texto-rodape { font-size: 10px; }
        .grid-4 .faixa-rodape { height: 9%; padding-top: 4px; }

        @media print {
            body { background: #fff; color: #000; display: block; height: auto; overflow: visible; }
            .sidebar { display: none !important; }
            .main-content { padding: 0; background: none; display: block; overflow: visible; }
            .paper-preview { box-shadow: none; border: none; margin: 0; page-break-after: always; }
            .grid-4 { width: 210mm; height: 297mm; display: grid !important; }
            .cartaz-container { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <!-- PAINEL DE CONTROLE LATERAL -->
    <div class="sidebar">
        <h2>IC ARTES - Sistema</h2>
        
        <div class="group">
            <label>Tipo de Cabeçalho / Tema</label>
            <select id="inTopo" onchange="mudarTemaECores()">
                <option value="OFERTA" data-color="#e60000">OFERTA (Vermelho)</option>
                <option value="CONFIRA" data-color="#0044cc">CONFIRA (Azul)</option>
                <option value="HORTIFRUTI" data-color="#008000">HORTIFRUTI (Verde)</option>
                <option value="LIMPEZA" data-color="#00bfff">LIMPEZA (Azul Céu)</option>
            </select>
        </div>

        <div class="group">
            <label>Formato da Impressão</label>
            <select id="boxSize" onchange="renderizarTudo()">
                <option value="A4">1 Cartaz Único por Folha A4</option>
                <option value="A5">1 Cartaz Único por Folha A5</option>
                <option value="tam-11x15">Tamanho Comercial 11x15 cm</option>
                <option value="tam-20x27">Tamanho Comercial 20x27 cm</option>
                <option value="grid-4">Multi-Cartaz: 4 por página (Lista)</option>
            </select>
        </div>

        <!-- ENTRADA PADRÃO PARA APENAS 1 CARTAZ -->
        <div id="panelFormUnico">
            <div class="group">
                <label>Descrição do Produto</label>
                <input type="text" id="inTitulo" value="COXÃO MOLE BOVINO KG" oninput="sincronizarDados()">
            </div>

            <div class="row">
                <div class="group" style="flex: 1;">
                    <label>Preço "De" (Opcional)</label>
                    <input type="text" id="inDe" placeholder="Ex: 39,90" oninput="sincronizarDados()">
                </div>
                <div class="group" style="flex: 1;">
                    <label>Selo Clube (Opcional)</label>
                    <input type="text" id="inClube" placeholder="Ex: No App" oninput="sincronizarDados()">
                </div>
            </div>

            <div class="row">
                <div class="group" style="flex: 2;">
                    <label>Preço Inteiro</label>
                    <input type="number" id="inInteiro" value="35" oninput="sincronizarDados()">
                </div>
                <div class="group" style="flex: 1;">
                    <label>Centavos</label>
                    <input type="number" id="inCentavos" value="90" oninput="sincronizarDados()">
                </div>
            </div>

            <div class="group">
                <label>Unidade de Medida inferior</label>
                <input type="text" id="inUnidade" value="UNIDADE" oninput="sincronizarDados()">
            </div>
        </div>

        <!-- PAINEL DA LISTA DINÂMICA (APARECE SÓ NO MODO 4 POR FOLHA) -->
        <div id="panelFormLista" class="lista-produtos-panel">
            <div class="sub-titulo-lista">Preencha as 4 ofertas da folha:</div>
            
            <!-- PRODUTO 1 -->
            <div style="border-bottom: 1px solid #4e4e75; margin-bottom: 10px; padding-bottom: 5px;">
                <label style="color:#00ffcc">Item 1</label>
                <input type="text" id="lProd1" value="PRODUTO LISTA 1" oninput="sincronizarDados()"><br>
                <div class="row" style="margin-top:4px;"><input type="number" id="lInt1" value="10" oninput="sincronizarDados()"><input type="number" id="lCent1" value="99" oninput="sincronizarDados()"></div>
            </div>
            <!-- PRODUTO 2 -->
            <div style="border-bottom: 1px solid #4e4e75; margin-bottom: 10px; padding-bottom: 5px;">
                <label style="color:#00ffcc">Item 2</label>
                <input type="text" id="lProd2" value="PRODUTO LISTA 2" oninput="sincronizarDados()"><br>
                <div class="row" style="margin-top:4px;"><input type="number" id="lInt2" value="14" oninput="sincronizarDados()"><input type="number" id="lCent2" value="90" oninput="sincronizarDados()"></div>
            </div>
            <!-- PRODUTO 3 -->
            <div style="border-bottom: 1px solid #4e4e75; margin-bottom: 10px; padding-bottom: 5px;">
                <label style="color:#00ffcc">Item 3</label>
                <input type="text" id="lProd3" value="PRODUTO LISTA 3" oninput="sincronizarDados()"><br>
                <div class="row" style="margin-top:4px;"><input type="number" id="lInt3" value="19" oninput="sincronizarDados()"><input type="number" id="lCent3" value="88" oninput="sincronizarDados()"></div>
            </div>
            <!-- PRODUTO 4 -->
            <div style="margin-bottom: 10px; padding-bottom: 5px;">
                <label style="color:#00ffcc">Item 4</label>
                <input type="text" id="lProd4" value="PRODUTO LISTA 4" oninput="sincronizarDados()"><br>
                <div class="row" style="margin-top:4px;"><input type="number" id="lInt4" value="25" oninput="sincronizarDados()"><input type="number" id="lCent4" value="00" oninput="sincronizarDados()"></div>
            </div>
        </div>

        <div class="group" style="margin-top: 15px;">
            <label>Inserir Imagem do Produto?</label>
            <select id="useImage" onchange="alternarVisibilidadeImagem()">
                <option value="nao">Não usar imagem</option>
                <option value="sim">Sim, inserir abaixo do cabeçalho</option>
            </select>
        </div>

        <div class="group" id="divFotoInput" style="display: none;">
            <label>Foto do Produto</label>
            <input type="file" id="inFoto" accept="image/*" onchange="processarFoto(event)">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Folha</button>
        <button class="btn-save" onclick="salvarComoImagem()">Salvar Imagem (WhatsApp)</button>
    </div>

    <!-- ÁREA DE VISUALIZAÇÃO DO PAPEL -->
    <div class="main-content">
        <div id="paperContainer" class="paper-preview A4"></div>
    </div>

    <script>
        let imagemBase64 = "";

        function renderizarTudo() {
            const boxSize = document.getElementById('boxSize').value;
            const container = document.getElementById('paperContainer');
            
            container.className = "paper-preview " + boxSize;

            let quantidadeCartazes = (boxSize === 'grid-4') ? 4 : 1;
            let cartazesHTML = '';

            if(boxSize === 'grid-4') {
                document.getElementById('panelFormUnico').style.display = "none";
                document.getElementById('panelFormLista').style.display = "block";
            } else {
                document.getElementById('panelFormUnico').style.display = "block";
                document.getElementById('panelFormLista').style.display = "none";
            }

            for(let i = 1; i <= quantidadeCartazes; i++) {
                cartazesHTML += `
                    <div class="cartaz-container" id="cartazRef_${i}">
                        <div class="faixa-topo">
                            <div class="badge-topo">OFERTA</div>
                        </div>
                        <div class="conteudo-principal">
                            <div class="product-image-top">
                                <img src="${imagemBase64}" alt="Produto" class="cartaz-img-tag">
                            </div>
                            <div class="product-title" id="outTitulo_${i}">NOME DO PRODUTO</div>
                            <div class="price-section">
                                <div class="price-old" id="outDe_${i}">De: R$ <span></span></div>
                                <div class="price-main">
                                    <span class="rs">R$</span>
                                    <span class="inteiro" id="outInt_${i}">00</span>
                                    <span class="centavos" id="outCent_${i}">,00</span>
                                </div>
                                <div class="unidade-medida" id="outUnidade_${i}">UNIDADE</div>
                            </div>
                            <div class="clube-tag" id="outClube_${i}"></div>
                        </div>
                        <div class="faixa-rodape">
                            <div class="texto-rodape">IC ARTES comunicação visual * cartazes *</div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = cartazesHTML;
            mudarTemaECores();
            alternarVisibilidadeImagem();
        }

        function sincronizarDados() {
            const boxSize = document.getElementById('boxSize').value;

            if(boxSize !== 'grid-4') {
                const titulo = document.getElementById('inTitulo').value;
                const precoDe = document.getElementById('inDe').value;
                const clube = document.getElementById('inClube').value;
                const inteiro = document.getElementById('inInteiro').value;
                const centavos = document.getElementById('inCentavos').value;
                const unidade = document.getElementById('inUnidade').value;

                if(document.getElementById('outTitulo_1')) document.getElementById('outTitulo_1').innerText = titulo;
                if(document.getElementById('outInt_1')) document.getElementById('outInt_1').innerText = inteiro;
                if(document.getElementById('outCent_1')) document.getElementById('outCent_1').innerText = centavos ? ',' + centavos : ',00';
                if(document.getElementById('outUnidade_1')) document.getElementById('outUnidade_1').innerText = unidade;

                let elDe = document.getElementById('outDe_1');
                if(elDe) {
                    if(precoDe.trim() !== "") {
                        elDe.style.display = "block";
                        elDe.querySelector('span').innerText = precoDe;
                    } else {
                        elDe.style.display = "none";
                    }
                }

                let elClube = document.getElementById('outClube_1');
                if(elClube) {
                    if(clube.trim() !== "") {
                        elClube.style.display = "block";
                        elClube.innerText = clube;
                    } else {
                        elClube.style.display = "none";
                    }
                }
            } else {
                for(let i = 1; i <= 4; i++) {
                    let titulo = document.getElementById(`lProd${i}`).value;
                    let inteiro = document.getElementById(`lInt${i}`).value;
                    let centavos = document.getElementById(`lCent${i}`).value;

                    if(document.getElementById(`outTitulo_${i}`)) document.getElementById(`outTitulo_${i}`).innerText = titulo;
                    if(document.getElementById(`outInt_${i}`)) document.getElementById(`outInt_${i}`).innerText = inteiro;
                    if(document.getElementById(`outCent_${i}`)) document.getElementById(`outCent_${i}`).innerText = centavos ? ',' + centavos : ',00';
                    if(document.getElementById(`outUnidade_${i}`)) document.getElementById(`outUnidade_${i}`).innerText = "UNIDADE"; 
                    if(document.getElementById(`outDe_${i}`)) document.getElementById(`outDe_${i}`).styl
