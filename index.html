<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cartazista Pro - IC ARTES</title>
    <style>
        /* CONFIGURAÇÕES DO PAINEL LATERAL (SaaS) */
        * { box-sizing: border-box; font-family: 'Arial Black', Gadget, sans-serif; }
        body { margin: 0; background-color: #1e1e2f; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } }
        
        .sidebar { width: 380px; background-color: #26263f; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.3); z-index: 10; font-family: system-ui, sans-serif; }
        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; overflow: visible; } }
        
        .main-content { flex: 1; background-color: #13131f; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; min-height: 100vh; }
        
        h2 { font-size: 18px; margin-top: 0; color: #00ffcc; border-bottom: 2px solid #3d3d5c; padding-bottom: 10px; font-family: system-ui, sans-serif; text-transform: uppercase; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a2a2c2; margin-bottom: 5px; font-weight: 600; font-family: system-ui, sans-serif; }
        input, select, textarea { width: 100%; padding: 10px; background-color: #31314f; border: 1px solid #4e4e75; border-radius: 6px; color: #fff; font-size: 15px; outline: none; font-family: system-ui, sans-serif; }
        input:focus, select:focus, textarea:focus { border-color: #00ffcc; }
        .row { display: flex; gap: 10px; }
        textarea { height: 140px; resize: none; font-size: 12px; }
        
        .btn-print { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 15px; text-transform: uppercase; }
        
        /* ZONA DE IMPRESSÃO */
        .print-zone { display: flex; flex-direction: column; gap: 30px; }
        .paper-preview { background-color: #fff; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden; position: relative; page-break-after: always; }
        
        /* DEFINIÇÕES DE TAMANHOS DE FOLHA */
        .A4-retrato { width: 210mm; height: 297mm; }
        .A4-paisagem { width: 297mm; height: 210mm; }
        
        /* GRIDS DE MULTIPLOS CARTAZES */
        .grid-2-folha { width: 210mm; height: 297mm; display: grid; grid-template-rows: 1fr 1fr; background: #fff; page-break-after: always; }
        .grid-2-folha .cartaz-container { border: 1px dashed #777 !important; height: 100% !important; width: 100% !important; }
        
        .grid-4-folha { width: 210mm; height: 297mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; background: #fff; page-break-after: always; }
        .grid-4-folha .cartaz-container { border: 1px dashed #777 !important; height: 100% !important; width: 100% !important; }

        /* CORES DOS TEMAS */
        .tema-confira { --cor-tema: #002244; --cor-texto-topo: #ffcc00; --texto-topo: "CONFIRA"; }
        .tema-azul-royal { --cor-tema: #0044cc; --cor-texto-topo: #ffffff; --texto-topo: "OFERTA"; }
        .tema-promocao-vermelho { --cor-tema: #e60000; --cor-texto-topo: #ffcc00; --texto-topo: "PROMOÇÃO"; }
        .tema-hortifruti-verde { --cor-tema: #008000; --cor-texto-topo: #ffffff; --texto-topo: "HORTIFRUTI"; }
        .tema-limpeza-azul-ceu { --cor-tema: #00bfff; --cor-texto-topo: #ffffff; --texto-topo: "LIMPEZA"; }

        /* REESTRUTURAÇÃO DO LAYOUT EM METADES (50% / 50%) */
        .cartaz-container { 
            width: 100%; 
            height: 100%; 
            background-color: #fff; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            position: relative; 
            overflow: hidden;
        }
        
        /* Topo Fixo */
        .faixa-topo {
            width: 100%;
            height: 14%;
            background-color: var(--cor-tema);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px;
        }
        .badge-topo { font-size: 55px; font-weight: 900; text-transform: uppercase; color: var(--cor-texto-topo); text-shadow: 2px 3px 0px rgba(0,0,0,0.3); }
        
        /* Corpo dividido em duas seções de 43% cada (Total 86% + 14% topo) */
        .metade-descricao {
            height: 38%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            background: #fff;
            z-index: 2;
        }
        .product-title { 
            font-size: 65px; 
            font-weight: 900; 
            text-align: center; 
            text-transform: uppercase; 
            color: #000; 
            line-height: 0.9;
            letter-spacing: -2px;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .metade-preco {
            height: 48%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(ellipse at center, #ffcc00 0%, #ffdb1a 60%, #ffffff 100%);
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            padding-bottom: 25px;
        }
        
        /* PREÇOS GIGANTES */
        .price-main { color: #e60000; font-weight: 900; display: flex; align-items: flex-start; justify-content: center; line-height: 0.65; }
        .inteiro { font-size: 290px; letter-spacing: -18px; }
        .centavos-box { display: flex; flex-direction: column; align-items: flex-start; margin-left: 10px; margin-top: 10px; }
        .centavos { font-size: 130px; font-weight: 900; }
        .unidade-medida { font-size: 32px; color: #000; font-weight: 900; text-transform: uppercase; margin-top: 5px; background: #fff; padding: 2px 12px; border: 3px solid #000; border-radius: 6px; }
        
        /* Rodapé Fixo Absoluto */
        .faixa-rodape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 7%;
            background-color: var(--cor-tema);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 50% 15px;
            border-top-right-radius: 50% 15px;
        }
        .texto-rodape { font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; }

        /* ========================================================
           AJUSTES DE ESCALA PARA OS NOVOS TAMANHOS DE IMPRESSÃO
        ======================================================== */
        
        /* A4 PAISAGEM */
        .A4-paisagem .badge-topo { font-size: 45px; }
        .A4-paisagem .product-title { font-size: 50px; }
        .A4-paisagem .inteiro { font-size: 200px; letter-spacing: -12px; }
        .A4-paisagem .centavos { font-size: 90px; }
        .A4-paisagem .unidade-medida { font-size: 24px; }
        .A4-paisagem .metade-preco { padding-bottom: 10px; }

        /* GRID 2 POR FOLHA (Médio) */
        .grid-2-folha .badge-topo { font-size: 42px; }
        .grid-2-folha .product-title { font-size: 45px; }
        .grid-2-folha .inteiro { font-size: 180px; letter-spacing: -10px; }
        .grid-2-folha .centavos { font-size: 80px; }
        .grid-2-folha .unidade-medida { font-size: 22px; }
        .grid-2-folha .metade-preco { padding-bottom: 15px; }

        /* GRID 4 POR FOLHA (Pequeno) */
        .grid-4-folha .badge-topo { font-size: 32px; }
        .grid-4-folha .product-title { font-size: 30px; letter-spacing: -1px; }
        .grid-4-folha .inteiro { font-size: 120px; letter-spacing: -6px; }
        .grid-4-folha .centavos { font-size: 55px; }
        .grid-4-folha .unidade-medida { font-size: 16px; border-width: 2px; padding: 1px 6px; }
        .grid-4-folha .metade-preco { padding-bottom: 5px; }
        .grid-4-folha .texto-rodape { font-size: 14px; }

        /* REGRAS DE IMPRESSÃO DO NAVEGADOR */
        @media print {
            body { background: #fff; color: #000; display: block; height: auto; overflow: visible; }
            .sidebar { display: none; }
            .main-content { background: #fff; padding: 0; overflow: visible; display: block; }
            .print-zone { gap: 0; }
            .paper-preview, .grid-2-folha, .grid-4-folha { box-shadow: none; margin: 0; border: none; page-break-inside: avoid; page-break-after: always; }
            
            /* Detecta automaticamente orientação paisagem se a classe estiver ativa */
            .A4-paisagem { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <!-- PAINEL LATERAL DE CONTROLE -->
    <div class="sidebar">
        <h2>IC ARTES - SISTEMA</h2>
        
        <div class="group">
            <label>Selecione o Tema / Cor</label>
            <select id="select-tema">
                <option value="tema-promocao-vermelho">PROMOÇÃO (Vermelho)</option>
                <option value="tema-confira">CONFIRA (Azul Escuro)</option>
                <option value="tema-azul-royal">OFERTA (Azul Royal)</option>
                <option value="tema-hortifruti-verde">HORTIFRUTI (Verde)</option>
                <option value="tema-limpeza-azul-ceu">LIMPEZA (Azul Céu)</option>
            </select>
        </div>

        <div class="group">
            <label>Formato de Impressão</label>
            <select id="select-formato">
                <option value="A4-retrato">A4 Retrato (1 Grande por Folha)</option>
                <option value="A4-paisagem">A4 Paisagem (Horizontal)</option>
                <option value="GRID-2">A4 - 2 Cartazes Médios por Folha</option>
                <option value="GRID-4">A4 - 4 Cartazes Pequenos por Folha</option>
            </select>
        </div>

        <div class="group">
            <label>Modo de Entrada de Dados</label>
            <select id="select-modo" onchange="alternarModo()">
                <option value="unico">Produto Único</option>
                <option value="lista">Lista de Produtos (Lote)</option>
            </select>
        </div>

        <!-- FORMULÁRIO DE PRODUTO ÚNICO -->
        <div id="form-unico">
            <div class="group">
                <label>Descrição do Produto</label>
                <input type="text" id="input-titulo" value="COXÃO MOLE BOVINO KG">
            </div>

            <div class="row">
                <div class="group" style="flex: 1.5;">
                    <label>Preço Inteiro</label>
                    <input type="text" id="input-inteiro" value="35">
                </div>
                <div class="group" style="flex: 1;">
                    <label>Centavos</label>
                    <input type="text" id="input-centavos" value="90">
                </div>
            </div>

            <div class="group">
                <label>Unidade de Medida</label>
                <input type="text" id="input-unidade" value="KG">
            </div>
        </div>

        <!-- FORMULÁRIO EM MODO LISTA -->
        <div id="form-lista" style="display: none;">
            <div class="group">
                <label>Insira os produtos (1 por linha)</label>
                <p style="font-size: 11px; color: #a2a2c2; margin-top: -3px; margin-bottom: 5px;">Padrão: Nome | Preço Inteiro | Centavos | Unidade</p>
                <textarea id="textarea-produtos" placeholder="Exemplo:&#10;COXÃO MOLE BOVINO KG|35|90|KG&#10;ARROZ INTEGRAL 5KG|24|50|UN&#10;FEIJÃO CARIOCA 1KG|07|89|PCT"></textarea>
            </div>
        </div>

        <div class="group">
            <label>Texto do Rodapé</label>
            <input type="text" id="input-rodape" value="IC ART'S">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Cartazes</button>
    </div>

    <!-- ÁREA DE PREVISÃO DA FOLHA -->
    <div class="main-content">
        <div class="print-zone" id="print-zone-container">
            <!-- Renderização dinâmica aqui -->
        </div>
    </div>

    <!-- SCRIPT LOGICO (100% OFFLINE) -->
    <script>
        const selectTema = document.getElementById('select-tema');
        const selectFormato = document.getElementById('select-formato');
        const selectModo = document.getElementById('select-modo');
        const inputTitulo = document.getElementById('input-titulo');
        const inputInteiro = document.getElementById('input-inteiro');
        const inputCentavos = document.getElementById('input-centavos');
        const inputUnidade = document.getElementById('input-unidade');
        const textareaProdutos = document.getElementById('textarea-produtos');
        const inputRodape = document.getElementById('input-rodape');
        const printZoneContainer = document.getElementById('print-zone-container');

        function alternarModo() {
            if (selectModo.value === "unico") {
                document.getElementById('form-unico').style.display = "block";
                document.getElementById('form-lista').style.display = "none";
            } else {
                document.getElementById('form-unico').style.display = "block"; // Deixa visível para complementar se faltar dados
                document.getElementById('form-lista').style.display = "block";
            }
            gerarCartazes();
        }

        // Gera a estrutura HTML padrão de um bloco de cartaz
        function obterEstruturaCartaz(titulo, inteiro, centavos, unidade, rodape, classeTema) {
            let textoTopo = "OFERTA";
            if(classeTema === "tema-confira") textoTopo = "CONFIRA";
            if(classeTema === "tema-promocao-vermelho") textoTopo = "PROMOÇÃO";
            if(classeTema === "tema-hortifruti-verde") textoTopo = "HORTIFRUTI";
            if(classeTema === "tema-limpeza-azul-ceu") textoTopo = "LIMPEZA";

            return `
                <div class="cartaz-container ${classeTema}">
                    <div class="faixa-topo">
                        <div class="badge-topo">${textoTopo}</div>
                    </div>
                    
                    <div class="metade-descricao">
                        <div class="product-title">${titulo.toUpperCase()}</div>
                    </div>
                    
                    <div class="metade-preco">
                        <div class="price-main">
                            <span class="inteiro">${inteiro}</span>
                            <div class="centavos-box">
                                <span class="centavos">${centavos}</span>
                            </div>
                        </div>
                        <div class="unidade-medida">${unidade.toUpperCase()}</div>
                    </div>
                    
                    <div class="faixa-rodape">
                        <div class="texto-rodape">${rodape.toUpperCase()}</div>
                    </div>
                </div>
            `;
        }

        function gerarCartazes() {
            printZoneContainer.innerHTML = "";
            const formato = selectFormato.value;
            const tema = selectTema.value;
            const rodape = inputRodape.value;

            // 1. Extração dos dados baseada no modo selecionado
            let listaProdutos = [];

            if (selectModo.value === "unico") {
                listaProdutos.push({
                    titulo: inputTitulo.value,
                    inteiro: inputInteiro.value,
                    centavos: inputCentavos.value,
                    unidade: inputUnidade.value
                });
            } else {
                const linhas = textareaProdutos.value.split('\n');
                linhas.forEach(linha => {
                    if (linha.trim() !== "") {
                        const dados = linha.split('|');
                        listaProdutos.push({
                            titulo: dados[0] ? dados[0].trim() : "PRODUTO",
                            inteiro: dados[1] ? dados[1].trim() : "00",
                            centavos: dados[2] ? dados[2].trim() : "00",
                            unidade: dados[3] ? dados[3].trim() : "UN"
                        });
                    }
                });
            }

            // 2. Distribuição nos novos formatos e grids organizados
            if (formato === "A4-retrato" || formato === "A4-paisagem") {
                // Renderiza um cartaz por folha inteira
                listaProdutos.forEach(p => {
                    const blocoHtml = obterEstruturaCartaz(p.titulo, p.inteiro, p.centavos, p.unidade, rodape, tema);
                    printZoneContainer.innerHTML += `<div class="paper-preview ${formato}">${blocoHtml}</div>`;
                });
            } 
            else if (formato === "GRID-2") {
                // Corta e monta de 2 em 2 cartazes por folha física
                for (let i = 0; i < listaProdutos.length; i += 2) {
                    let cartazesDaFolhaHtml = "";
                    
                    // Primeiro item do par
                    cartazesDaFolhaHtml += obterEstruturaCartaz(listaProdutos[i].titulo, listaProdutos[i].inteiro, listaProdutos[i].centavos, listaProdutos[i].unidade, rodape, tema);
                    
                    // Segundo item do par (se houver, senão gera um espelho vazio estrutural)
                    if (listaProdutos[i+1]) {
                        cartazesDaFolhaHtml += obterEstruturaCartaz(listaProdutos[i+1].titulo, listaProdutos[i+1].inteiro, listaProdutos[i+1].centavos, listaProdutos[i+1].unidade, rodape, tema);
                    } else {
                        cartazesDaFolhaHtml += obterEstruturaCartaz(listaProdutos[i].titulo, listaProdutos[i].inteiro, listaProdutos[i].centavos, listaProdutos[i].unidade, rodape, tema);
                    }

                    printZoneContainer.innerHTML += `<div class="grid-2-folha">${cartazesDaFolhaHtml}</div>`;
                }
            } 
            else if (formato === "GRID-4") {
                // Corta e monta de 4 em 4 cartazes pequenos por folha física
                for (let i = 0; i < listaProdutos.length; i += 4) {
                    let cartazesDaFolhaHtml = "";
                    for (let j = 0; j < 4; j++) {
                        const indiceAtual = i + j;
                        if (listaProdutos[indiceAtual]) {
                            cartazesDaFolhaHtml += obterEstruturaCartaz(listaProdutos[indiceAtual].titulo, listaProdutos[indiceAtual].inteiro, listaProdutos[indiceAtual].centavos, listaProdutos[indiceAtual].unidade, rodape, tema);
                        } else {
                            // Preenche os quadrantes que sobrarem vazios com réplicas do primeiro para manter estabilidade visual
                            cartazesDaFolhaHtml += obterEstruturaCartaz(listaProdutos[i].titulo, listaProdutos[i].inteiro, listaProdutos[i].centavos, listaProdutos[i].unidade, rodape, tema);
                        }
                    }
                    printZoneContainer.innerHTML += `<div class="grid-4-folha">${cartazesDaFolhaHtml}</div>`;
                }
            }
        }

        // Ouvintes de atualização em tempo real
        selectTema.addEventListener('change', gerarCartazes);
        selectFormato.addEventListener('change', gerarCartazes);
        inputTitulo.addEventListener('input', gerarCartazes);
        inputInteiro.addEventListener('input', gerarCartazes);
