<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartazes Profissional - IC ART'S</title>
    <!-- Importando fontes grossas estilo cartazista -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-app: #0f172a;
            --theme-header-bg: #cc0000;
            --theme-header-text: #ffcc00;
            --theme-price: #cc0000;
            --theme-brush: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Archivo Black', sans-serif;
        }

        body {
            background-color: var(--bg-app);
            display: flex;
            height: 100vh;
            color: #f8fafc;
        }

        /* Painel Lateral Administrativo */
        .control-panel {
            width: 380px;
            background: #1e293b;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .control-panel h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            background: #334155;
            padding: 4px;
            border-radius: 6px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #2563eb;
            color: white;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #0f172a;
            color: white;
        }

        .form-group textarea {
            height: 120px;
            font-family: monospace;
            resize: none;
            font-size: 0.85rem;
        }

        .btn-print {
            background-color: #22c55e;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }

        .btn-print:hover {
            background-color: #16a34a;
        }

        /* Área do Canvas de Visualização */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: auto;
            background: #0f172a;
        }

        /* --- O CARTAZ IDÊNTICO À FOTO --- */
        .poster-container {
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* TAMANHOS DE SELEÇÃO */
        .size-20x27 { width: 567px; height: 766px; } /* Proporção exata 20x27cm */
        .size-meia { width: 595px; height: 421px; }  /* A5 Horizontal ou Meia A4 */
        .size-quatro { width: 297px; height: 421px; } /* 4 por folha A4 */

        /* Topo em Onda Curva Semelhante à Foto */
        .poster-header-wave {
            width: 110%;
            height: 16%;
            background: var(--theme-header-bg);
            color: var(--theme-header-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            text-transform: uppercase;
            font-family: 'Archivo Black', sans-serif;
            border-bottom-left-radius: 50% 40%;
            border-bottom-right-radius: 50% 40%;
            margin-top: -5px;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }

        /* Miolo e Texto do Produto */
        .poster-body {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
            padding: 10px;
        }

        .product-title {
            font-size: 2.8em;
            color: #000000;
            text-transform: uppercase;
            line-height: 0.95;
            font-style: italic;
            word-break: break-word;
            margin-bottom: 5px;
        }

        .product-unit {
            font-size: 1.8em;
            color: #000000;
            text-transform: uppercase;
            line-height: 1;
        }

        /* Bloco de Preço Robusto com Fundo Pincelado Simulado */
        .price-wrapper {
            position: relative;
            width: 90%;
            height: 42%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        /* Efeito de preenchimento amarelo do cartazista */
        .brush-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--theme-brush);
            border-radius: 30% 70% 70% 30% / 45% 30% 70% 55%; /* Forma orgânica simulando pincel */
            transform: scaleX(1.05) rotate(-1deg);
            z-index: 1;
        }

        .price-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            color: var(--theme-price);
            width: 100%;
        }

        .price-main {
            font-size: 11em;
            line-height: 0.75;
            letter-spacing: -6px;
        }

        .price-right-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 2px;
            margin-top: -5px;
        }

        .price-comma {
            font-size: 5em;
            line-height: 0.4;
            margin-bottom: -15px;
        }

        .price-cents {
            font-size: 5em;
            line-height: 0.7;
        }

        .price-footer-unit {
            font-size: 1.2em;
            color: #000000;
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
            z-index: 2;
            margin-top: -15px;
            background: var(--theme-brush);
            padding: 2px 10px;
            border-radius: 4px;
        }

        /* Base em Onda Invertida */
        .poster-footer-wave {
            width: 110%;
            height: 12%;
            background: var(--theme-header-bg);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            text-transform: uppercase;
            border-top-left-radius: 50% 40%;
            border-top-right-radius: 50% 40%;
            margin-bottom: -5px;
            padding-top: 10px;
            letter-spacing: 1px;
        }

        /* --- CONFIGURAÇÕES DOS NOVOS TEMAS --- */
        /* Oferta (Vermelho/Amarelo) */
        .theme-oferta {
            --theme-header-bg: #cc0000;
            --theme-header-text: #ffcc00;
            --theme-price: #cc0000;
            --theme-brush: #ffcc00;
        }
        /* Confira (Azul) */
        .theme-confira {
            --theme-header-bg: #0044cc;
            --theme-header-text: #ffffff;
            --theme-price: #0044cc;
            --theme-brush: #ffcc00;
        }
        /* Hortifruti (Verde) */
        .theme-horti {
            --theme-header-bg: #14532d;
            --theme-header-text: #ffffff;
            --theme-price: #cc0000;
            --theme-brush: #facc15;
        }

        /* Ajustes finos para escalas menores (4 num folha) */
        .size-quatro .poster-header-wave { font-size: 2em; }
        .size-quatro .product-title { font-size: 1.4em; }
        .size-quatro .product-unit { font-size: 0.9em; }
        .size-quatro .price-main { font-size: 5.5em; }
        .size-quatro .price-cents { font-size: 2.5em; }
        .size-quatro .price-comma { font-size: 2.5em; }
        .size-quatro .price-footer-unit { font-size: 0.6em; margin-top: -5px;}
        .size-quatro .poster-footer-wave { font-size: 0.8em; }

        /* Impressão Limpa */
        @media print {
            body { background: white; }
            .control-panel { display: none !important; }
            .preview-area { padding: 0; overflow: visible; background: white; }
            .poster-container {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
                float: left;
            }
            /* Configuração Dinâmica para 4 itens na folha A4 */
            .print-grid-4 {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                width: 100vw;
                height: 100vh;
            }
            .print-grid-4 .poster-container {
                width: 100% !important;
                height: 100% !important;
                border: 1px dashed #ccc;
            }
        }
    </style>
</head>
<body>

    <!-- Menu Administrativo -->
    <div class="control-panel">
        <h2>IC ART'S - Gerador</h2>
        
        <div class="tabs">
            <button id="tab-single" class="tab-btn active" onclick="switchTab('single')">Produto Único</button>
            <button id="tab-list" class="tab-btn" onclick="switchTab('list')">Lista em Lote</button>
        </div>

        <div class="form-group">
            <label for="input-theme">Tema do Cartaz</label>
            <select id="input-theme" oninput="updatePoster()">
                <option value="theme-oferta">OFERTA (Vermelho / Amarelo)</option>
                <option value="theme-confira">CONFIRA (Azul)</option>
                <option value="theme-horti">HORTIFRUTI (Verde)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-size">Modelo / Tamanho</label>
            <select id="input-size" oninput="updatePoster()">
                <option value="size-20x27">Cartaz 20x27 cm</option>
                <option value="size-meia">Meia Folha (Horizontal)</option>
                <option value="size-quatro">Pequeno (4 numa folha)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-badge">Texto do Topo</label>
            <input type="text" id="input-badge" value="OFERTA" oninput="updatePoster()">
        </div>

        <!-- Formulário de Produto Único -->
        <div id="panel-single" class="panel-content">
            <div class="form-group">
                <label for="input-title">Nome do Produto</label>
                <input type="text" id="input-title" value="COXÃO MOLE" oninput="updatePoster()">
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label for="input-unit">Subtítulo (Ex: BOVINO KG)</label>
                <input type="text" id="input-unit" value="BOVINO KG" oninput="updatePoster()">
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label for="input-price">Preço Real</label>
                <input type="number" id="input-price" value="35" oninput="updatePoster()">
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label for="input-cents">Centavos</label>
                <input type="text" id="input-cents" value="90" maxlength="2" oninput="updatePoster()">
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label for="input-footer-unit">Unidade Rodapé</label>
                <input type="text" id="input-footer-unit" value="UNIDADE" oninput="updatePoster()">
            </div>
        </div>

        <!-- Formulário de Carga em Lista -->
        <div id="panel-list" class="panel-content" style="display: none;">
            <div class="form-group">
                <label for="input-bulk">Lista de Produtos (1 por linha)</label>
                <textarea id="input-bulk" placeholder="Formato: Nome;Subtítulo;Preço;Centavos;Rodapé&#10;Exemplo:&#10;PATINHO;BOVINO KG;32;90;KG&#10;DETERGENTE;YPE 500ML;2;45;UN" oninput="updatePoster()"></textarea>
            </div>
        </div>

        <div class="form-group">
            <label for="input-footer">Marca do Rodapé</label>
            <input type="text" id="input-footer" value="IC ART'S" oninput="updatePoster()">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Elementos</button>
    </div>

    <!-- Canvas de Impressão Dinâmico -->
    <div class="preview-area">
        <div id="print-wrapper-box" class="">
            <!-- Os cartazes serão gerados via JavaScript aqui dentro -->
        </div>
    </div>

    <script>
        let currentTab = 'single';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-single').classList.toggle('active', tab === 'single');
            document.getElementById('tab-list').classList.toggle('active', tab === 'list');
            document.getElementById('panel-single').style.display = tab === 'single' ? 'block' : 'none';
            document.getElementById('panel-list').style.display = tab === 'list' ? 'block' : 'none';
            updatePoster();
        }

        function createPosterHTML(theme, size, badge, title, unit, price, cents, footerUnit, footerText) {
            return `
                <div class="poster-container ${size} ${theme}">
                    <div class="poster-header-wave">${badge}</div>
                    <div class="poster-body">
                        <div class="product-title">${title}</div>
                        <div class="product-unit">${unit}</div>
                        <div class="price-wrapper">
                            <div class="brush-bg"></div>
                            <div class="price-container">
                                <span class="price-main">${price}</span>
                                <div class="price-right-box">
                                    <span class="price-comma">,</span>
                                    <span class="price-cents">${cents}</span>
                                </div>
                            </div>
                        </div>
                        <div class="price-footer-unit">${footerUnit}</div>
                    </div>
                    <div class="poster-footer-wave">${footerText}</div>
                </div>
            `;
        }

        function updatePoster() {
            const theme = document.getElementById('input-theme').value;
            const size = document.getElementById('input-size').value;
            const badge = document.getElementById('input-badge').value;
            const footerText = document.getElementById('input-footer').value;
            const wrapper = document.getElementById('print-wrapper-box');

            // Configura o grid de impressão caso seja selecionada a opção de 4 por folha
            if(size === 'size-quatro') {
                wrapper.className = 'print-grid-4';
            } else {
                wrapper.className = '';
            }

            if (currentTab === 'single') {
                const title = document.getElementById('input-title').value;
                const unit = document.getElementById('input-unit').value;
                const price = document.getElementById('input-price').value;
                const cents = document.getElementById('input-cents').value;
                const footerUnit = document.getElementById('input-footer-unit').value;

                wrapper.innerHTML = createPosterHTML(theme, size, badge, title, unit, price, cents, footerUnit, footerText);
            } else {
                const bulkText = document.getElementById('input-bulk').value.trim();
                if(!bulkText) {
                    wrapper.innerHTML = "<p style='color:#64748b;'>Nenhum item na lista.</p>";
                    return;
                }
                
                let lines = bulkText.split('\n');
                let combinedHTML = '';
                
                lines.forEach(line => {
                    let parts = line.split(';');
                    if(parts.length >= 4) {
                        let title = parts[0] || '';
                        let unit = parts[1] || '';
                        let price = parts[2] || '0';
                        let cents = parts[3] || '00';
                        let footerUnit = parts[4] || 'UNIDADE';
                        combinedHTML += createPosterHTML(theme, size, badge, title, unit, price, cents, footerUnit, footerText);
                    }
                });
                wrapper.innerHTML = combinedHTML;
            }
        }

        // Execução Inicial
        updatePoster();
    </script>
</body>
</html>
