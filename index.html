<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartazes Ultra Impacto - IC ART'S</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <!-- Importando fontes com o maior peso e densidade possíveis -->
    <link href="https://googleapis.com/css2?family=Archivo+Black&family=Impact&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-app: #0f172a;
            --theme-header-bg: #cc0000;
            --theme-header-text: #ffcc00;
            --theme-price: #cc0000;
            --theme-brush: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Força a fonte mais grossa existente por padrão em todos os textos */
            font-family: 'Archivo Black', 'Arial Black', sans-serif;
            font-weight: 900;
        }

        body {
            background-color: var(--bg-app);
            display: flex;
            height: 100vh;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Painel Lateral Administrativo */
        .control-panel {
            width: 380px;
            background: #1e293b;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .control-panel h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            background: #334155;
            padding: 4px;
            border-radius: 6px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #2563eb;
            color: white;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .form-group textarea {
            height: 80px;
            resize: none;
        }

        .btn-print {
            background-color: #22c55e;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            margin-top: auto;
        }

        .btn-print:hover {
            background-color: #16a34a;
        }

        /* Área do Canvas de Visualização */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: auto;
            background: #0f172a;
        }

        /* O CARTAZ */
        .poster-container {
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* TAMANHOS DE SELEÇÃO */
        .size-20x27 { width: 567px; height: 766px; } 
        .size-meia { width: 595px; height: 421px; }  
        .size-quatro { width: 297px; height: 421px; } 

        /* Topo em Onda Curva - Texto Gigante Extra-Bold */
        .poster-header-wave {
            width: 130%;
            height: 20%;
            background: var(--theme-header-bg);
            color: var(--theme-header-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem; /* Fonte ampliada ao máximo */
            text-transform: uppercase;
            border-bottom-left-radius: 50% 45%;
            border-bottom-right-radius: 50% 45%;
            margin-top: -5px;
            padding-bottom: 20px;
            letter-spacing: -2px; /* Letras coladas para maior agressividade visual */
            text-shadow: 3px 3px 0px #000;
        }

        /* Miolo e Texto do Produto */
        .poster-body {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            z-index: 2;
            padding: 15px 10px;
        }

        /* Título expandido ao limite da largura */
        .product-title {
            font-size: 3.4rem;
            color: #000000;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -1px;
            word-break: break-word;
            max-width: 95%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-unit {
            font-size: 2rem;
            color: #111111;
            text-transform: uppercase;
            line-height: 0.9;
            margin-top: 5px;
        }

        /* Bloco de Preço Ultra Robusto */
        .price-wrapper {
            position: relative;
            width: 95%;
            height: 48%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brush-bg {
            position: absolute;
            width: 100%;
            height: 115%;
            background: var(--theme-brush);
            border-radius: 20% 80% 75% 25% / 40% 30% 70% 60%; 
            transform: scaleX(1.05) scaleY(1.02) rotate(-1.5deg);
            z-index: 1;
        }

        .price-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            /* Fonte ultra-adensada e compacta para preencher toda a área vertical */
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: var(--theme-price);
            width: 100%;
        }

        /* Números Gigantes Colados */
        .price-main {
            font-size: 16.5rem; 
            line-height: 0.65;
            letter-spacing: -12px;
            font-weight: 900;
        }

        .price-right-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: -5px;
            margin-top: -15px;
        }

        .price-comma {
            font-size: 7.5rem;
            line-height: 0.3;
            margin-bottom: -15px;
            font-weight: 900;
        }

        .price-cents {
            font-size: 7.5rem;
            line-height: 0.65;
            font-weight: 900;
            letter-spacing: -4px;
        }

        .price-footer-unit {
            font-size: 1.3rem;
            color: #000000;
            text-transform: uppercase;
            z-index: 3;
            margin-top: -10px;
            background: var(--theme-brush);
            padding: 4px 14px;
            border: 2px solid #000;
            border-radius: 4px;
        }

        /* Base em Onda Invertida - Texto esticado ao limite */
        .poster-footer-wave {
            width: 130%;
            height: 14%;
            background: var(--theme-header-bg);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            text-transform: uppercase;
            border-top-left-radius: 50% 45%;
            border-top-right-radius: 50% 45%;
            margin-bottom: -5px;
            padding-top: 20px;
            letter-spacing: 0px;
            text-align: center;
        }

        /* Configuração de Impressão */
        @media print {
            body * {
                visibility: hidden;
            }
            .preview-area, .preview-area *, .poster-container, .poster-container * {
                visibility: visible;
            }
            .control-panel {
                display: none;
            }
            .preview-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                padding: 0;
                background: white;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .poster-container {
                box-shadow: none;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Painel Lateral de Controle -->
    <div class="control-panel">
        <h2>IC ART'S Ultra Bold</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('conteudo')">Conteúdo</button>
            <button class="tab-btn" onclick="switchTab('temas')">Cores</button>
        </div>

        <!-- Conteúdo da Aba Dados -->
        <div id="tab-conteudo" class="tab-content">
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Tamanho do Cartaz</label>
                <select id="input-size" onchange="updateSize()">
                    <option value="size-20x27">Padrão 20x27 cm</option>
                    <option value="size-meia">Meia Folha (A5)</option>
                    <option value="size-quatro">Quatro por Folha (A6)</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Texto do Topo</label>
                <input type="text" id="input-header" value="OFERTA" oninput="updateText()">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Nome do Produto</label>
                <textarea id="input-title" oninput="updateText()">SABÃO EM PÓ OMO LAVE ROSAS</textarea>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Detalhe da Embalagem</label>
                <input type="text" id="input-unit" value="CAIXA 1.6KG" oninput="updateText()">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Preço Inteiro</label>
                <input type="text" id="input-price-main" value="19" oninput="updateText()">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Centavos</label>
                <input type="text" id="input-price-cents" value="98" oninput="updateText()">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Unidade de Medida Base</label>
                <input type="text" id="input-footer-unit" value="NESTA EMBALAGEM O KG SAI A R$ 12,48" oninput="updateText()">
            </div>
            <div class="form-group">
                <label>Texto do Rodapé</label>
                <input type="text" id="input-footer" value="VÁLIDO ENQUANTO DURAREM OS ESTOQUES" oninput="updateText()">
            </div>
        </div>

        <!-- Conteúdo da Aba Temas -->
        <div id="tab-temas" class="tab-content" style="display: none;">
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Cor das Ondas (Topo/Base)</label>
                <input type="color" id="color-header-bg" value="#cc0000" onchange="updateColors()">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Cor do Texto do Topo</label>
                <input type="color" id="color-header-text" value="#ffcc00" onchange="updateColors()">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Cor do Fundo Pincelado</label>
                <input type="color" id="color-brush" value="#ffcc00" onchange="updateColors()">
            </div>
            <div class="form-group">
                <label>Cor do Preço</label>
                <input type="color" id="color-price" value="#cc0000" onchange="updateColors()">
            </div>
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Cartaz</button>
    </div>

    <!-- Área de Visualização do Cartaz -->
    <div class="preview-area">
        <div id="poster" class="poster-container size-20x27">
            
            <div id="view-header" class="poster-header-wave">OFERTA</div>
            
            <div class="poster-body">
                <div id="view-title" class="product-title">SABÃO EM PÓ OMO LAVE ROSAS</div>
                <div id="view-unit" class="product-unit">CAIXA 1.6KG</div>
                
                <div class="price-wrapper">
                    <div class="brush-bg"></div>
                    <div class="price-container">
                        <span id="view-price-main" class="price-main">19</span>
                        <div class="price-right-box">
                            <span class="price-comma">,</span>
                            <span id="view-price-cents" class="price-cents">98</span>
                        </div>
                    </div>
                </div>
                
                <div id="view-footer-unit" class="price-footer-unit">NESTA EMBALAGEM O KG SAI A R$ 12,48</div>
            </div>
            
            <div id="view-footer" class="poster-footer-wave">VÁLIDO ENQUANTO DURAREM OS ESTOQUES</div>
        </div>
    </div>

    <!-- Scripts de Controle de Estado -->
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).style.display = 'block';
        }

        function updateText() {
            document.getElementById('view-header').innerText = document.getElementById('input-header').value;
            document.getElementById('view-title').innerText = document.getElementById('input-title').value;
            document.getElementById('view-unit').innerText = document.getElementById('input-unit').value;
            document.getElementById('view-price-main').innerText = document.getElementById('input-price-main').value;
            document.getElementById('view-price-cents').innerText = document.getElementById('input-price-cents').value;
            document.getElementById('view-footer-unit').innerText = document.getElementById('input-footer-unit').value;
            document.getElementById('view-footer').innerText = document.getElementById('input-footer').value;
        }

        function updateSize() {
            const poster = document.getElementById('poster');
            const selectedSize = document.getElementById('input-size').value;
            
            poster.className = 'poster-container ' + selectedSize;
        }

        function updateColors() {
            const root = document.documentElement;
            root.style.setProperty('--theme-header-bg', document.getElementById('color-header-bg').value);
            root.style.setProperty('--theme-header-text', document.getElementById('color-header-text').value);
            root.style.setProperty('--theme-brush', document.getElementById('color-brush').value);
            root.style.setProperty('--theme-price', document.getElementById('color-price').value);
        }
    </script>
</body>
</html>
