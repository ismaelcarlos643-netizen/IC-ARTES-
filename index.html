<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartazes Ultra Impacto - IC ART'S</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-app: #0f172a;
            --theme-header-bg: #cc0000;
            --theme-header-text: #ffcc00;
            --theme-price: #cc0000;
            --theme-brush: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Archivo Black', 'Arial Black', sans-serif;
            font-weight: 900;
        }

        body {
            background-color: var(--bg-app);
            display: flex;
            height: 100vh;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Painel Lateral Administrativo */
        .control-panel {
            width: 380px;
            background: #1e293b;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .control-panel h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .form-group textarea {
            height: 60px;
            resize: none;
        }

        .btn-print {
            background-color: #22c55e;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            margin-top: 10px;
        }

        .btn-print:hover {
            background-color: #16a34a;
        }

        /* Novas regras do Gerenciador de Lista */
        .list-section {
            border-top: 2px solid #334155;
            padding-top: 15px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-add {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-add:hover { background-color: #0ea5e9; }
        .product-table-wrapper {
            max-height: 150px;
            overflow-y: auto;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #475569;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
        }
        .product-table th, .product-table td {
            padding: 8px;
            border-bottom: 1px solid #334155;
        }
        .product-table th { background: #1e293b; color: #94a3b8; }
        .btn-del {
            background: #ef4444;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Área do Canvas de Visualização */
        .preview-area {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: auto;
            background: #0f172a;
        }

        /* O CARTAZ */
        .poster-container {
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* TAMANHOS DE CARTAZ EXISTENTES E NOVOS */
        .size-a4-paisagem { width: 756px; height: 535px; } 
        .size-meia-a4 { width: 378px; height: 535px; }  
        .size-quatro-a4 { width: 268px; height: 378px; } 
        .size-a4-retrato { width: 535px; height: 756px; }
        .size-quatro-na-folha { width: 350px; height: 495px; }

        /* Customização dinâmica para formatos horizontais */
        .size-a4-paisagem .poster-header-wave { height: 25%; font-size: 4.5rem; }
        .size-a4-paisagem .price-main { font-size: 14rem; }
        .size-a4-paisagem .price-cents { font-size: 6.5rem; }
        .size-a4-paisagem .price-comma { font-size: 6.5rem; }

        /* Customização dinâmica para formatos reduzidos */
        .size-meia-a4 .poster-header-wave { font-size: 3.5rem; }
        .size-meia-a4 .product-title { font-size: 2.2rem; }
        .size-meia-a4 .product-unit { font-size: 1.3rem; }
        .size-meia-a4 .price-main { font-size: 11rem; letter-spacing: -6px; }
        .size-meia-a4 .price-cents, .size-meia-a4 .price-comma { font-size: 5rem; }

        .size-quatro-a4 .poster-header-wave { font-size: 2.5rem; }
        .size-quatro-a4 .product-title { font-size: 1.6rem; }
        .size-quatro-a4 .product-unit { font-size: 1rem; }
        .size-quatro-a4 .price-main { font-size: 8rem; letter-spacing: -4px; }
        .size-quatro-a4 .price-cents, .size-quatro-a4 .price-comma { font-size: 3.5rem; }

        /* Customizações do tamanho A4 Retrato */
        .size-a4-retrato .poster-header-wave { font-size: 6rem; height: 22%; }
        .size-a4-retrato .product-title { font-size: 4rem; margin-top: 25px; }
        .size-a4-retrato .product-unit { font-size: 2.2rem; }
        .size-a4-retrato .price-main { font-size: 19rem; letter-spacing: -14px; }
        .size-a4-retrato .price-cents, .size-a4-retrato .price-comma { font-size: 8.5rem; }
        .size-a4-retrato .price-wrapper { height: 55%; }

        /* Customizações de 4 cartazes pequenos em 1 folha */
        .size-quatro-na-folha .poster-header-wave { font-size: 3rem; }
        .size-quatro-na-folha .product-title { font-size: 2rem; }
        .size-quatro-na-folha .product-unit { font-size: 1.2rem; }
        .size-quatro-na-folha .price-main { font-size: 10rem; letter-spacing: -5px; }
        .size-quatro-na-folha .price-cents, .size-quatro-na-folha .price-comma { font-size: 4.5rem; }

        /* Topo em Onda Curva */
        .poster-header-wave {
            width: 130%;
            height: 20%;
            background: var(--theme-header-bg);
            color: var(--theme-header-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            text-transform: uppercase;
            border-bottom-left-radius: 50% 45%;
            border-bottom-right-radius: 50% 45%;
            margin-top: -5px;
            padding-bottom: 15px;
            letter-spacing: -2px;
            text-shadow: 3px 3px 0px #000;
        }

        /* Miolo e Texto do Produto */
        .poster-body {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            z-index: 2;
            padding: 10px;
        }

        .product-title {
            font-size: 3.2rem;
            color: #000000;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -1px;
            word-break: break-word;
            max-width: 95%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 10px;
        }

        .product-unit {
            font-size: 1.8rem;
            color: #111111;
            text-transform: uppercase;
            line-height: 0.9;
            margin-top: 5px;
        }

        /* Bloco de Preço Ultra Robusto */
        .price-wrapper {
            position: relative;
            width: 95%;
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .brush-bg {
            position: absolute;
            width: 100%;
            height: 115%;
            background: var(--theme-brush);
            border-radius: 20% 80% 75% 25% / 40% 30% 70% 60%; 
            transform: scaleX(1.05) scaleY(1.02) rotate(-1.5deg);
            z-index: 1;
        }

        .price-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-end; 
            justify-content: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: var(--theme-price);
            width: 100%;
        }

        .price-main {
            font-size: 16.5rem; 
            line-height: 0.75;
            letter-spacing: -12px;
            font-weight: 900;
        }

        .price-right-box {
            display: flex;
            flex-direction: row-reverse; 
            align-items: flex-end;
            margin-left: -5px;
        }

        .price-comma {
            font-size: 7.5rem;
            line-height: 0.75;
            font-weight: 900;
            margin-right: -2px; 
        }

        .price-cents {
            font-size: 7.5rem;
            line-height: 0.75;
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 2.5rem; 
        }

        /* Regras de Layout de Impressão */
        @media print {
            .control-panel { display: none !important; }
            .preview-area { 
                padding: 0 !important; 
                margin: 0 !important;
                background: none !important; 
                display: block !important; 
                overflow: visible !important;
            }
            .poster-container { 
                box-shadow: none !important; 
                page-break-after: always !important; 
                margin: 0 auto !important;
            }
            
            /* Estrutura de grid específica de 4 itens por folha na impressão física */
            .preview-area.layout-grid-4 {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                grid-template-rows: repeat(2, 1fr) !important;
                gap: 5px !important;
                width: 210mm !important;
                height: 297mm !important;
                box-sizing: border-box;
            }
            .preview-area.layout-grid-4 .poster-container {
                page-break-after: avoid !important;
                width: 100% !important;
                height: 100% !important;
            }
            body { background: white; }
        }
    </style>
</head>
<body>

    <!-- Painel Lateral Administrativo -->
    <div class="control-panel">
        <h2>Painel de Controle</h2>
        
        <div class="form-group">
            <label for="input-size">Tamanho do Cartaz</label>
            <select id="input-size">
                <option value="size-meia-a4">Meio A4 (Vertical)</option>
                <option value="size-quatro-a4">1/4 de A4 (Vertical)</option>
                <option value="size-a4-paisagem">A4 Inteiro (Horizontal)</option>
                <option value="size-a4-retrato">A4 Inteiro (Retrato)</option>
                <option value="size-quatro-na-folha">4 por Folha A4 (Grid)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-theme">Tema de Cores</label>
            <select id="input-theme">
                <option value="vermelho-amarelo">Vermelho e Amarelo (Oferta)</option>
                <option value="preto-amarelo">Preto e Amarelo (Impacto)</option>
                <option value="azul-branco">Azul e Branco (Limpeza/Frios)</option>
                <option value="verde-branco">Verde e Branco (Hortifrúti)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-header">Texto do Topo</label>
            <input type="text" id="input-header" value="OFERTA">
        </div>

        <div class="form-group">
            <label for="input-title">Nome do Produto</label>
            <textarea id="input-title">REFRIGERANTE COCA-COLA PET 2L</textarea>
        </div>

        <div class="form-group">
            <label for="input-unit">Unidade de Medida</label>
            <input type="text" id="input-unit" value="CADA U">
        </div>

        <div class="form-group">
            <label for="input-price">Preço R$ (Ex: 8,99)</label>
            <input type="text" id="input-price" value="8,99">
        </div>

        <!-- Seção da Lista de Produtos adicionada -->
        <div class="list-section">
            <button class="btn-add" id="btn-add-product">Adicionar à Lista</button>
            <div class="product-table-wrapper">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="product-list-body">
                        <!-- Itens entram aqui dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Cartaz(es)</button>
    </div>

    <!-- Área do Canvas de Visualização Dinâmica dos Cartazes -->
    <div class="preview-area" id="preview-area">
        <!-- Os cartazes gerados em lote serão injetados aqui -->
    </div>

    <!-- Lógica de Atualização e Gerenciamento de Listas -->
    <script>
        const root = document.documentElement;

        // Elementos de Entrada
        const inputSize = document.getElementById('input-size');
        const inputTheme = document.getElementById('input-theme');
        const inputHeader = document.getElementById('input-header');
        const inputTitle = document.getElementById('input-title');
        const inputUnit = document.getElementById('input-unit');
        const inputPrice = document.getElementById('input-price');
        const btnAddProduct = document.getElementById('btn-add-product');
        const productListBody = document.getElementById('product-list-body');
        const previewArea = document.getElementById('preview-area');

        // Banco de dados em memória para os itens da lista
        let products = [
            { header: "OFERTA", title: "REFRIGERANTE COCA-COLA PET 2L", unit: "CADA U", price: "8,99" }
        ];

        const themes = {
            'vermelho-amarelo': { headerBg: '#cc0000', headerText: '#ffcc00', price: '#cc0000', brush: '#ffcc00' },
            'preto-amarelo': { headerBg: '#000000', headerText: '#ffcc00', price: '#000000', brush: '#ffcc00' },
            'azul-branco': { headerBg: '#0052cc', headerText: '#ffffff', price: '#0052cc', brush: '#ffffff' },
            'verde-branco': { headerBg: '#00802b', headerText: '#ffffff', price: '#00802b', brush: '#ffffff' }
        };

        // Renderiza e gera os cartazes na tela baseados na lista atual
        function renderPosters() {
            previewArea.innerHTML = '';
            
            // Configura classe especial se for layout de 4 por folha
            if(inputSize.value === 'size-quatro-na-folha') {
                previewArea.classList.add('layout-grid-4');
            } else {
                previewArea.classList.remove('layout-grid-4');
            }

            products.forEach((prod, index) => {
                let priceVal = prod.price.replace('R$', '').trim();
                if (!priceVal.includes(',')) priceVal += ',00';
                const parts = priceVal.split(',');
                const mainPrice = parts[0] || '0';
                const centsPrice = parts[1].substring(0, 2).padEnd(2, '0');

                // Estrutura de cartaz idêntica à original
                const posterHTML = `
                    <div class="poster-container ${inputSize.value}">
                        <div class="poster-header-wave">${prod.header}</div>
                        <div class="poster-body">
                            <div class="product-title">${prod.title}</div>
                            <div class="product-unit">${prod.unit}</div>
                            <div class="price-wrapper">
                                <div class="brush-bg"></div>
                                <div class="price-container">
                                    <span class="price-main">${mainPrice}</span>
                                    <div class="price-right-box">
                                        <span class="price-cents">${centsPrice}</span>
                                        <span class="price-comma">,</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                previewArea.insertAdjacentHTML('beforeend', posterHTML);
            });
        }

        // Renderiza a lista na tabela lateral
        function renderTable() {
            productListBody.innerHTML = '';
            products.forEach((prod, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${prod.title}</td>
                    <td>R$ ${prod.price}</td>
                    <td><button class="btn-del" onclick="removeProduct(${index})">X</button></td>
                `;
                productListBody.appendChild(tr);
            });
        }

        function updatePoster() {
            // Atualiza o item atual ativo (o primeiro da lista sincroniza com os inputs avulsos)
            if (products.length > 0) {
                products[0] = {
                    header: inputHeader.value,
                    title: inputTitle.value,
                    unit: inputUnit.value,
                    price: inputPrice.value
                };
            }
            
            const selectedTheme = themes[inputTheme.value];
            root.style.setProperty('--theme-header-bg', selectedTheme.headerBg);
            root.style.setProperty('--theme-header-text', selectedTheme.headerText);
            root.style.setProperty('--theme-price', selectedTheme.price);
            root.style.setProperty('--theme-brush', selectedTheme.brush);

            renderTable();
            renderPosters();
        }

        // Ação para adicionar novos itens à lista
        btnAddProduct.addEventListener('click', () => {
            products.push({
                header: inputHeader.value,
                title: inputTitle.value,
