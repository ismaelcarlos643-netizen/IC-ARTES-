<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cartazista - Cartaz Fácil Clone</title>
    <style>
        /* CSS RESET E ESTRUTURA BASE (Estilo SaaS / Cartaz Fácil) */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: #1e1e2f; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout em Duas Colunas */
        .sidebar { width: 380px; background-color: #26263f; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.3); z-index: 10; }
        .main-content { flex: 1; background-color: #13131f; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; }
        
        /* Elementos de Formulário */
        h2 { font-size: 20px; margin-top: 0; color: #00ffcc; border-bottom: 2px solid #3d3d5c; padding-bottom: 10px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a2a2c2; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; background-color: #31314f; border: 1px solid #4e4e75; border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #00ffcc; }
        .row { display: flex; gap: 10px; }
        
        /* Botão de Impressão Estilo Profissional */
        .btn-print { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 15px; text-transform: uppercase; }
        .btn-print:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0,255,204,0.4); }

        /* QUADRO DE VISUALIZAÇÃO DO PAPEL */
        .paper-preview { background-color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform-origin: center; display: block; }
        
        /* DIMENSÕES REAIS DE IMPRESSÃO */
        .A4 { width: 210mm; height: 297mm; }
        .A5 { width: 148mm; height: 210mm; }
        .tam-11x15 { width: 110mm; height: 150mm; }
        .tam-20x27 { width: 200mm; height: 270mm; }

        /* GRID PARA 4 CARTAZES EM 1 FOLHA A4 */
        .grid-4 { width: 210mm; height: 297mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; background: #fff; }
        .grid-4 .cartaz-container { width: 100% !important; height: 100% !important; border: 3px dashed #ccc; page-break-inside: avoid; }
        
        /* DESIGN INTERNO DO CARTAZ (IGUAL SUPERMERCADO) */
        .cartaz-container { width: 100%; height: 100%; background-color: #fff; color: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; box-sizing: border-box; position: relative; overflow: hidden; }
        
        /* MODELO 1: PADRÃO OFERTA */
        .badge-topo { width: 100%; text-align: center; background-color: #e60000; color: #fff; font-size: 55px; font-weight: 900; padding: 10px 0; text-transform: uppercase; letter-spacing: 3px; border-radius: 8px; clip-path: polygon(0% 0%, 100% 0%, 95% 100%, 50% 85%, 5% 100%); }
        
        /* MODELO 2: SPLASH COMPACTO */
        .cartaz-container.modelo-splash .badge-topo { clip-path: none; border-radius: 50px; background: linear-gradient(90deg, #e60000, #ff5500); font-size: 45px; }

        /* ÁREAS DE CONTEÚDO */
        .product-title { font-size: 42px; font-weight: 800; text-align: center; text-transform: uppercase; color: #111; margin: 20px 0; line-height: 1.1; max-height: 140px; overflow: hidden; }
        .product-image-wrap { flex: 1; display: flex; justify-content: center; align-items: center; max-height: 40%; margin-bottom: 10px; }
        .product-image-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* PRECIFICAÇÃO DINÂMICA COMPLETA */
        .price-section { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-bottom: 15px; }
        .price-old { font-size: 24px; color: #666; text-decoration: line-through; font-weight: bold; margin-bottom: -5px; display: none; }
        .price-main { color: #e60000; font-weight: 900; display: flex; align-items: flex-start; justify-content: center; line-height: 0.85; }
        .rs { font-size: 45px; margin-top: 15px; font-weight: 800; margin-right: 5px; }
        .inteiro { font-size: 165px; letter-spacing: -5px; }
        .centavos { font-size: 75px; margin-top: 15px; font-weight: 800; border-bottom: 5px solid currentColor; padding-bottom: 2px; line-height: 0.7; }
        
        /* ADICIONAL: SELO EXCLUSIVO CLUBE */
        .clube-tag { position: absolute; bottom: 15px; right: 15px; background-color: #000; color: #fff; padding: 8px 12px; font-weight: 900; border-radius: 4px; font-size: 14px; text-transform: uppercase; display: none; transform: rotate(-5deg); box-shadow: 2px 4px 10px rgba(0,0,0,0.3); }

        /* AJUSTES AUTOMÁTICOS PARA O MODO 4 POR FOLHA */
        .grid-4 .badge-topo { font-size: 22px; padding: 5px 0; }
        .grid-4 .product-title { font-size: 20px; margin: 8px 0; max-height: 50px; }
        .grid-4 .rs { font-size: 20px; margin-top: 5px; }
        .grid-4 .inteiro { font-size: 75px; letter-spacing: -2px; }
        .grid-4 .centavos { font-size: 35px; margin-top: 5px; border-bottom-width: 2px; }
        .grid-4 .price-old { font-size: 14px; }
        .grid-4 .clube-tag { font-size: 8px; padding: 4px 6px; bottom: 5px; right: 5px; }

        /* REGRAS CRÍTICAS DE IMPRESSÃO */
        @media print {
            body { background: #fff; color: #000; display: block; height: auto; overflow: visible; }
            .sidebar { display: none !important; }
            .main-content { padding: 0; background: none; display: block; overflow: visible; }
            .paper-preview { box-shadow: none; border: none; margin: 0; page-break-after: always; transform: scale(1) !important; }
            .grid-4 { width: 210mm; height: 297mm; display: grid !important; }
            .cartaz-container { border: none !important; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: PAINEL DE CONTROLE (IDÊNTICO AO SaaS ORIGINAL) -->
    <div class="sidebar">
        <h2>Cartaz Fácil - Editor</h2>
        
        <div class="group">
            <label>Modelo do Layout</label>
            <select id="layoutStyle" onchange="renderizarTudo()">
                <option value="modelo-padrao">Padrão Oferta do Dia</option>
                <option value="modelo-splash">Splash - Choque de Preço</option>
            </select>
        </div>

        <div class="group">
            <label>Formato da Impressão</label>
            <select id="boxSize" onchange="renderizarTudo()">
                <option value="A4">1 Cartaz por Folha A4</option>
                <option value="A5">1 Cartaz por Folha A5</option>
                <option value="tam-11x15">Tamanho Comercial 11x15 cm</option>
                <option value="tam-20x27">Tamanho Comercial 20x27 cm</option>
                <option value="grid-4">Multi-Cartaz: 4 por página (A4)</option>
            </select>
        </div>

        <div class="group">
            <label>Cor Temática da Campanha</label>
            <select id="themeColor" onchange="renderizarTudo()">
                <option value="#e60000">Vermelho (Oferta Regular)</option>
                <option value="#ffcc00">Amarelo (Sacolão/Hortifruti)</option>
                <option value="#008000">Verde (Limpeza/Sustentável)</option>
                <option value="#000000">Preto (Black Friday)</option>
            </select>
        </div>

        <div class="group">
            <label>Texto do Topo (Header)</label>
            <input type="text" id="inTopo" value="OFERTA" oninput="sincronizarDados()">
        </div>

        <div class="group">
            <label>Descrição do Produto</label>
            <input type="text" id="inTitulo" value="ARROZ INTEGRAL TIPO 1 COMANCHE 5KG" oninput="sincronizarDados()">
        </div>

        <div class="row">
            <div class="group" style="flex: 1;">
                <label>Preço "De" (Opcional)</label>
                <input type="text" id="inDe" placeholder="Ex: 24,90" oninput="sincronizarDados()">
            </div>
            <div class="group" style="flex: 1;">
                <label>Selo Clube Especial</label>
                <input type="text" id="inClube" placeholder="Ex: Exclusivo App" oninput="sincronizarDados()">
            </div>
        </div>

        <div class="row">
            <div class="group" style="flex: 2;">
                <label>Preço Inteiro</label>
                <input type="number" id="inInteiro" value="18" oninput="sincronizarDados()">
            </div>
            <div class="group" style="flex: 1;">
                <label>Centavos</label>
                <input type="number" id="inCentavos" value="99" oninput="sincronizarDados()">
            </div>
        </div>

        <div class="group">
            <label>Foto do Produto PNG (Sem Fundo)</label>
            <input type="file" id="inFoto" accept="image/*" onchange="processarFoto(event)">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir em Alta Definição</button>
    </div>

    <!-- MAIN CONTENT: INTERFACE DE PREVISÃO EM TEMPO REAL -->
    <div class="main-content">
        <div id="paperContainer" class="paper-preview A4">
            <!-- Os blocos serão gerados dinamicamente via JS aqui dentro -->
        </div>
    </div>

    <!-- JAVASCRIPT: MOTOR DE RENDERIZAÇÃO EM TEMPO REAL -->
    <script>
        let imagemBase64 = "https://placeholder.com";

        // Gera a estrutura do papel dependendo do layout escolhido (1 por folha ou 4 por folha)
        function renderizarTudo() {
            const boxSize = document.getElementById('boxSize').value;
            const container = document.getElementById('paperContainer');
            const layoutStyle = document.getElementById('layoutStyle').value;

            // Altera as classes do contêiner principal de visualização
            container.className = "paper-preview " + boxSize;

            let quantidadeCartazes = (boxSize === 'grid-4') ? 4 : 1;
            let cartazesHTML = '';

            // Renderiza as estruturas dos blocos de ofertas
            for(let i = 0; i < quantidadeCartazes; i++) {
                cartazesHTML += `
                    <div class="cartaz-container ${layoutStyle}">
                        <div class="badge-topo">OFERTA</div>
                        <div class="product-title"></div>
                        <div class="product-image-wrap">
                            <img src="${imagemBase64}" alt="Produto">
                        </div>
                        <div class="price-section">
                            <div class="price-old">De: R$ <span></span></div>
                            <div class="price-main">
                                <span class="rs">R$</span>
                                <span class="inteiro">00</span>
                                <span class="centavos">,00</span>
                            </div>
                        </div>
                        <div class="clube-tag"></div>
                    </div>
                `;
            }
            container.innerHTML = cartazesHTML;
            sincronizarDados();
        }

        // Distribui os valores inseridos na barra lateral simultaneamente em todos os cartazes ativos
        function sincronizarDados() {
            const topo = document.getElementById('inTopo').value;
            const titulo = document.getElementById('inTitulo').value;
            const precoDe = document.getElementById('inDe').value;
            const clube = document.getElementById('inClube').value;
            const inteiro = document.getElementById('inInteiro').value;
            const centavos = document.getElementById('inCentavos').value;
            const cor = document.getElementById('themeColor').value;

            // Injeta dados nas tags correspondentes de todos os cartazes gerados no DOM
            document.querySelectorAll('.badge-topo').forEach(el => {
                el.innerText = topo;
                el.style.backgroundColor = (cor === "#ffcc00") ? "#ffcc00" : cor;
                el.style.color = (cor === "#ffcc00") ? "#000" : "#fff";
                if(document.getElementById('layoutStyle').value === 'modelo-splash' && cor !== '#ffcc00') {
                    el.style.background = `linear-gradient(90deg, ${cor}, #ff5500)`;
                }
            });

            document.querySelectorAll('.cartaz-container').forEach(el => el.style.borderColor = cor);
            document.querySelectorAll('.product-title').forEach(el => el.innerText = titulo);
            
            // Gerenciamento e exibição do preço promocional "De:"
            document.querySelectorAll('.price-old').forEach(el => {
                if(precoDe.trim() !== "") {
                    el.style.display = "block";
                    el.querySelector('span').innerText = precoDe;
                } else {
                    el.style.display = "none";
                }
            });

            // Ajuste do Preço Principal "Por:"
            document.querySelectorAll('.inteiro').forEach(el => el.innerText = inteiro);
            document.querySelectorAll('.centavos').forEach(el => el.innerText = centavos ? ',' + centavos : ',00');
            document.querySelectorAll('.price-main').forEach(el => el.style.color = cor);

            // Gerenciamento do Selo Clube
            document.querySelectorAll('.clube-tag').forEach(el => {
                if(clube.trim() !== "") {
                    el.style.display = "block";
                    el.innerText = clube;
                    el.style.backgroundColor = (cor === "#000000") ? "#e60000" : "#000";
                } else {
                    el.style.display = "none";
                }
            });
        }

        // Processa imagens locais sem requisições de servidores adicionais
        function processarFoto(event) {
            const reader = new FileReader();
            reader.onload = function() {
                imagemBase64 = reader.result;
                document.querySelectorAll('.product-image-wrap img').forEach(img => img.src = imagemBase64);
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // Inicialização automática do sistema ao abrir a tela
        renderizarTudo();
    </script>
</body>
                  </html>
