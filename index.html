<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartazes Ultra Impacto - IC ART'S</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-app: #0f172a;
            --theme-header-bg: #cc0000;
            --theme-header-text: #ffcc00;
            --theme-price: #cc0000;
            --theme-brush: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Archivo Black', 'Arial Black', sans-serif;
            font-weight: 900;
        }

        body {
            background-color: var(--bg-app);
            display: flex;
            height: 100vh;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Painel Lateral Administrativo */
        .control-panel {
            width: 380px;
            background: #1e293b;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .control-panel h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .form-group textarea {
            height: 60px;
            resize: none;
        }

        .btn-print {
            background-color: #22c55e;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            margin-top: auto;
        }

        .btn-print:hover {
            background-color: #16a34a;
        }

        /* Área do Canvas de Visualização */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: auto;
            background: #0f172a;
        }

        /* O CARTAZ */
        .poster-container {
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* NOVOS TAMANHOS ADICIONADOS (Proporções exatas baseadas em pixels) */
        .size-a4-paisagem { width: 756px; height: 535px; } 
        .size-meia-a4 { width: 378px; height: 535px; }  
        .size-quatro-a4 { width: 268px; height: 378px; } 

        /* Customização dinâmica para formatos horizontais */
        .size-a4-paisagem .poster-header-wave { height: 25%; font-size: 4.5rem; }
        .size-a4-paisagem .price-main { font-size: 14rem; }
        .size-a4-paisagem .price-cents { font-size: 6.5rem; }
        .size-a4-paisagem .price-comma { font-size: 6.5rem; }

        /* Customização dinâmica para formatos reduzidos */
        .size-meia-a4 .poster-header-wave { font-size: 3.5rem; }
        .size-meia-a4 .product-title { font-size: 2.2rem; }
        .size-meia-a4 .product-unit { font-size: 1.3rem; }
        .size-meia-a4 .price-main { font-size: 11rem; letter-spacing: -6px; }
        .size-meia-a4 .price-cents, .size-meia-a4 .price-comma { font-size: 5rem; }

        .size-quatro-a4 .poster-header-wave { font-size: 2.5rem; }
        .size-quatro-a4 .product-title { font-size: 1.6rem; }
        .size-quatro-a4 .product-unit { font-size: 1rem; }
        .size-quatro-a4 .price-main { font-size: 8rem; letter-spacing: -4px; }
        .size-quatro-a4 .price-cents, .size-quatro-a4 .price-comma { font-size: 3.5rem; }

        /* Topo em Onda Curva */
        .poster-header-wave {
            width: 130%;
            height: 20%;
            background: var(--theme-header-bg);
            color: var(--theme-header-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            text-transform: uppercase;
            border-bottom-left-radius: 50% 45%;
            border-bottom-right-radius: 50% 45%;
            margin-top: -5px;
            padding-bottom: 15px;
            letter-spacing: -2px;
            text-shadow: 3px 3px 0px #000;
        }

        /* Miolo e Texto do Produto */
        .poster-body {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            z-index: 2;
            padding: 10px;
        }

        .product-title {
            font-size: 3.2rem;
            color: #000000;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -1px;
            word-break: break-word;
            max-width: 95%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-unit {
            font-size: 1.8rem;
            color: #111111;
            text-transform: uppercase;
            line-height: 0.9;
            margin-top: 5px;
        }

        /* Bloco de Preço Ultra Robusto */
        .price-wrapper {
            position: relative;
            width: 95%;
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brush-bg {
            position: absolute;
            width: 100%;
            height: 115%;
            background: var(--theme-brush);
            border-radius: 20% 80% 75% 25% / 40% 30% 70% 60%; 
            transform: scaleX(1.05) scaleY(1.02) rotate(-1.5deg);
            z-index: 1;
        }

        .price-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-end; /* Alinha todos os elementos pela base inferior */
            justify-content: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: var(--theme-price);
            width: 100%;
        }

        .price-main {
            font-size: 16.5rem; 
            line-height: 0.75;
            letter-spacing: -12px;
            font-weight: 900;
        }

        /* Nova estrutura para alinhar a vírgula embaixo perto do número grande */
        .price-right-box {
            display: flex;
            flex-direction: row-reverse; /* Inverte para a vírgula ficar antes dos centavos na base */
            align-items: flex-end;
            margin-left: -5px;
        }

        .price-comma {
            font-size: 7.5rem;
            line-height: 0.75;
            font-weight: 900;
            margin-right: -2px; /* Cola a vírgula nos centavos */
        }

        .price-cents {
            font-size: 7.5rem;
            line-height: 0.75;
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 2.5rem; /* Eleva os centavos mantendo a vírgula no chão */
        }

        /* Ajustes específicos de elevação dos centavos por tamanho */
        .size-a4-paisagem .price-cents { margin-bottom: 2rem; }
        .size-meia-a4 .price-cents { margin-bottom: 1.5rem; }
        .size-quatro-a4 .price-cents { margin-bottom: 1rem; }

        .price-footer-unit {
            font-size: 1.2rem;
            color: #000000;
            text-transform: uppercase;
            z-index: 3;
            margin-top: -5px;
            background: var(--theme-brush);
            padding: 2px 12px;
            border: 2px solid #000;
            border-radius: 4px;
        }

        .poster-footer-wave {
            width: 130%;
            height: 10%;
            background: var(--theme-header-bg);
            border-top-left-radius: 50% 35%;
            border-top-right-radius: 50% 35%;
            margin-bottom: -5px;
        }

        @media print {
            body * { visibility: hidden; }
            .preview-area, .preview-area *, .poster-container, .poster-container * { visibility: visible; }
            body { background: #fff; }
            .control-panel { display: none; }
            .preview-area {
                position: absolute; left: 0; top: 0; width: 100%; height: 100%;
                padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; background: white;
            }
            .poster-container { box-shadow: none; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <!-- Painel Lateral de Controle -->
    <div class="control-panel">
        <h2>IC ART'S - Gerador</h2>
        
        <div class="form-group">
            <label for="select-size">Tamanho do Cartaz</label>
            <select id="select-size" onchange="changeSize()">
                <option value="size-a4-paisagem">A4 Paisagem (29,7 x 21 cm)</option>
                <option value="size-meia-a4">Meia Folha A4 / A5 (14,8 x 21 cm)</option>
                <option value="size-quatro-a4">1/4 de Folha A4 / A6 (10,5 x 14,8 cm)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-header">Texto do Topo (Oferta)</label>
            <input type="text" id="input-header" value="OFERTA" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-title">Nome do Produto</label>
            <textarea id="input-title" oninput="updatePoster()">SABÃO EM PÓ OMO GIGANTE</textarea>
        </div>

        <div class="form-group">
            <label for="input-unit">Subtítulo / Detalhe</label>
            <input type="text" id="input-unit" value="LAVAGEM PERFEITA 1.6KG" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-price">Preço (Ex: 19,98)</label>
            <input type="text" id="input-price" value="19,98" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="input-footer-unit">Unidade de Medida</label>
            <input type="text" id="input-footer-unit" value="CADA" oninput="updatePoster()">
        </div>

        <div class="form-group">
            <label for="select-theme">Tema de Cores</label>
            <select id="select-theme" onchange="updateTheme()">
                <option value="red-yellow">Vermelho e Amarelo (Supermercado)</option>
                <option value="black-yellow">Preto e Amarelo (Especial)</option>
                <option value="blue-white">Azul e Branco (Farmácia)</option>
                <option value="green-yellow">Verde e Amarelo (Hortifrúti)</option>
            </select>
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Cartaz</button>
    </div>

    <!-- Área de Visualização -->
    <div class="preview-area">
        <div id="poster" class="poster-container size-a4-paisagem">
            <div class="poster-header-wave" id="poster-header">OFERTA</div>
            
            <div class="poster-body">
                <div style="width: 100%;">
                    <div class="product-title" id="poster-title">SABÃO EM PÓ OMO GIGANTE</div>
                    <div class="product-unit" id="poster-unit">LAVAGEM PERFEITA 1.6KG</div>
                </div>

                <div class="price-wrapper">
                    <div class="brush-bg"></div>
                    <div class="price-container">
                        <span class="price-main" id="price-main">19</span>
                        <div class="price-right-box">
                            <span class="price-cents" id="price-cents">98</span>
                            <span class="price-comma">,</span>
                        </div>
                    </div>
                </div>

                <div class="price-footer-unit" id="poster-footer-unit">CADA</div>
            </div>

            <div class="poster-footer-wave"></div>
        </div>
    </div>

    <script>
        function updatePoster() {
            const headerText = document.getElementById('input-header').value;
            const titleText = document.getElementById('input-title').value;
            const unitText = document.getElementById('input-unit').value;
            const priceText = document.getElementById('input-price').value;
            const footerUnitText = document.getElementById('input-footer-unit').value;

            let mainPrice = "0";
            let centsPrice = "00";
            
            if (priceText.includes(',')) {
                const parts = priceText.split(',');
                mainPrice = parts[0] || "0";
                centsPrice = parts[1] || "00";
            } else if (priceText.includes('.')) {
                const parts = priceText.split('.');
                mainPrice = parts[0] || "0";
                centsPrice = parts[1] || "00";
            } else {
                mainPrice = priceText || "0";
            }

            if (centsPrice.length === 1) centsPrice += "0";

            document.getElementById('poster-header').innerText = headerText;
            document.getElementById('poster-title').innerText = titleText;
            document.getElementById('poster-unit').innerText = unitText;
            document.getElementById('price-main').innerText = mainPrice;
            document.getElementById('price-cents').innerText = centsPrice.substring(0, 2);
            document.getElementById('poster-footer-unit').innerText = footerUnitText;
        }

        function changeSize() {
            const select = document.getElementById('select-size');
            const poster = document.getElementById('poster');
            
            poster.classList.remove('size-a4-paisagem', 'size-meia-a4', 'size-quatro-a4');
            poster.classList.add(select.value);
        }

        function updateTheme() {
            const theme = document.getElementById('select-theme').value;
            const root = document.documentElement;

            if (theme === 'red-yellow') {
                root.style.setProperty('--theme-header-bg', '#cc0000');
                root.style.setProperty('--theme-header-text', '#ffcc00');
                root.style.setProperty('--theme-price', '#cc0000');
                root.style.setProperty('--theme-brush', '#ffcc00');
            } else if (theme === 'black-yellow') {
                root.style.setProperty('--theme-header-bg', '#111111');
                root.style.setProperty('--theme-header-text', '#ffcc00');
                root.style.setProperty('--theme-price', '#111111');
                root.style.setProperty('--theme-brush', '#ffcc00');
            } else if (theme === 'blue-white') {
                root.style.setProperty('--theme-header-bg', '#1e40af');
                root.style.setProperty('--theme-header-text', '#ffffff');
                root.style.setProperty('--theme-price', '#1e40af');
                root.style.setProperty('--theme-brush', '#f1f5f9');
            } else if (theme === 'green-yellow') {
                root.style.setProperty('--theme-header-bg', '#15803d');
                root.style.setProperty('--theme-header-text', '#ffffff');
                root.style.setProperty('--theme-price', '#166534');
                root.style.setProperty('--theme-brush', '#fef08a');
            }
        }

        updatePoster();
    </script>
</body>
            </html>
