<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cartazista Pro - IC ARTES</title>
    <style>
        /* CONFIGURAÇÕES DO PAINEL LATERAL (SaaS) */
        * { box-sizing: border-box; font-family: 'Arial Black', Gadget, sans-serif; }
        body { margin: 0; background-color: #1e1e2f; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } }
        
        .sidebar { width: 380px; background-color: #26263f; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.3); z-index: 10; font-family: system-ui, sans-serif; }
        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; overflow: visible; } }
        
        .main-content { flex: 1; background-color: #13131f; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; min-height: 100vh; }
        
        h2 { font-size: 18px; margin-top: 0; color: #00ffcc; border-bottom: 2px solid #3d3d5c; padding-bottom: 10px; font-family: system-ui, sans-serif; text-transform: uppercase; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a2a2c2; margin-bottom: 5px; font-weight: 600; font-family: system-ui, sans-serif; }
        input, select, textarea { width: 100%; padding: 10px; background-color: #31314f; border: 1px solid #4e4e75; border-radius: 6px; color: #fff; font-size: 15px; outline: none; font-family: system-ui, sans-serif; }
        input:focus, select:focus, textarea:focus { border-color: #00ffcc; }
        .row { display: flex; gap: 10px; }
        textarea { height: 120px; resize: none; font-size: 13px; }
        
        .btn-print { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 15px; text-transform: uppercase; }
        
        /* PREVISÃO DA FOLHA */
        .print-zone { display: flex; flex-direction: column; gap: 20px; }
        .paper-preview { background-color: #fff; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); page-break-after: always; position: relative; }
        
        /* TAMANHOS DE PAPEL */
        .A4 { width: 210mm; height: 297mm; }
        .A5 { width: 148mm; height: 210mm; }

        /* CONFIGURAÇÃO DE CORES DOS TEMAS (CONFORME SOLICITADO) */
        .tema-confira { --cor-tema: #002244; --cor-texto-topo: #ffcc00; --texto-topo: "CONFIRA"; }
        .tema-azul-royal { --cor-tema: #0044cc; --cor-texto-topo: #ffffff; --texto-topo: "OFERTA"; }
        .tema-promocao-vermelho { --cor-tema: #e60000; --cor-texto-topo: #ffcc00; --texto-topo: "PROMOÇÃO"; }
        .tema-hortifruti-verde { --cor-tema: #008000; --cor-texto-topo: #ffffff; --texto-topo: "HORTIFRUTI"; }
        .tema-limpeza-azul-ceu { --cor-tema: #00bfff; --cor-texto-topo: #ffffff; --texto-topo: "LIMPEZA"; }

        /* NOVO DESIGN DO CARTAZ IGUAL À IMAGEM DO CLIENTE */
        .cartaz-container { 
            width: 100%; 
            height: 100%; 
            background-color: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 0; 
            box-sizing: border-box; 
            position: relative; 
            overflow: hidden;
        }
        
        /* FAIXA DO TOPO ARREDONDADA / ONDULADA */
        .faixa-topo {
            width: 100%;
            height: 18%;
            background-color: var(--cor-tema);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 50% 40px;
            border-bottom-right-radius: 50% 40px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
        }
        .badge-topo { 
            font-size: 75px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: var(--cor-texto-topo);
            text-shadow: 3px 4px 0px rgba(0,0,0,0.3);
            text-align: center;
            font-family: 'Arial Black', Gadget, sans-serif;
        }
        
        /* CONTEÚDO CENTRAL COM EFEITO DE PINCELADO AMARELO (IGUAL AO MODELO) */
        .conteudo-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px 25px;
            /* Simulação do fundo pincelado amarelo com bordas suaves brancas */
            background: radial-gradient(ellipse at center, #ffcc00 0%, #ffdb1a 50%, #ffffff 75%);
        }

        .product-title { 
            font-size: 55px; 
            font-weight: 900; 
            text-align: center; 
            text-transform: uppercase; 
            color: #000; 
            line-height: 0.95;
            margin: 10px 0;
            letter-spacing: -1px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
        }
        
        /* SEÇÃO DE PREÇOS GRANDES VERMELHOS */
        .price-section { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            position: relative;
        }
        .price-main { color: #e60000; font-weight: 900; display: flex; align-items: flex-start; justify-content: center; line-height: 0.72; }
        .inteiro { font-size: 280px; letter-spacing: -15px; font-family: 'Arial Black', Gadget, sans-serif; }
        .centavos-box { display: flex; flex-direction: column; align-items: flex-start; margin-left: 5px; margin-top: 15px; }
        .virgula { font-size: 110px; line-height: 0.5; margin-right: -15px; margin-top: 130px; font-weight: 900; }
        .centavos { font-size: 140px; font-weight: 900; line-height: 0.7; }
        .unidade-medida { font-size: 32px; color: #000; font-weight: 900; text-transform: uppercase; margin-top: 5px; letter-spacing: -1px; }
        
        /* FAIXA DO RODAPÉ ARREDONDADA */
        .faixa-rodape {
            width: 100%;
            height: 10%;
            background-color: var(--cor-tema);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 50% 25px;
            border-top-right-radius: 50% 25px;
        }
        .texto-rodape {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* AJUSTES PROPORCIONAIS PARA TAMANHO A5 */
        .A5 .badge-topo { font-size: 50px; }
        .A5 .product-title { font-size: 38px; }
        .A5 .inteiro { font-size: 190px; letter-spacing: -10px; }
        .A5 .virgula { font-size: 70px; margin-top: 90px; }
        .A5 .centavos { font-size: 95px; }
        .A5 .unidade-medida { font-size: 22px; }
        .A5 .texto-rodape { font-size: 22px; }

        /* REGRAS DE IMPRESSÃO IMPEDINDO QUEBRA DE PÁGINA INCORRETA */
        @media print {
            body { background: #fff; color: #000; display: block; height: auto; overflow: visible; }
            .sidebar { display: none; }
            .main-content { background: #fff; padding: 0; overflow: visible; display: block; }
            .print-zone { gap: 0; }
            .paper-preview { box-shadow: none; margin: 0; border: none; page-break-inside: avoid; page-break-after: always; }
            @page { margin: 0; }
        }
    </style>
</head>
<body>

    <!-- PAINEL LATERAL DE CONTROLE -->
    <div class="sidebar">
        <h2>IC ARTES - SISTEMA</h2>
        
        <div class="group">
            <label>Selecione o Tema / Cor</label>
            <select id="select-tema">
                <option value="tema-promocao-vermelho">PROMOÇÃO (Vermelho)</option>
                <option value="tema-confira">CONFIRA (Azul Escuro)</option>
                <option value="tema-azul-royal">OFERTA (Azul Royal)</option>
                <option value="tema-hortifruti-verde">HORTIFRUTI (Verde)</option>
                <option value="tema-limpeza-azul-ceu">LIMPEZA (Azul Céu)</option>
            </select>
        </div>

        <div class="group">
            <label>Formato da Folha</label>
            <select id="select-formato">
                <option value="A4">Folha A4 Inteira</option>
                <option value="A5">Folha A5 (Metade da A4)</option>
            </select>
        </div>

        <div class="group">
            <label>Modo de Entrada de Dados</label>
            <select id="select-modo" onchange="alternarModo()">
                <option value="unico">Produto Único</option>
                <option value="lista">Lista de Produtos (Vários Cartazes)</option>
            </select>
        </div>

        <!-- FORMULÁRIO DE PRODUTO ÚNICO -->
        <div id="form-unico">
            <div class="group">
                <label>Descrição do Produto</label>
                <input type="text" id="input-titulo" value="COXÃO MOLE BOVINO KG">
            </div>

            <div class="row">
                <div class="group" style="flex: 1.5;">
                    <label>Preço Inteiro</label>
                    <input type="text" id="input-inteiro" value="35">
                </div>
                <div class="group" style="flex: 1;">
                    <label>Centavos</label>
                    <input type="text" id="input-centavos" value="90">
                </div>
            </div>

            <div class="group">
                <label>Unidade de Medida Inferior</label>
                <input type="text" id="input-unidade" value="UNIDADE">
            </div>
        </div>

        <!-- FORMULÁRIO EM MODO LISTA -->
        <div id="form-lista" style="display: none;">
            <div class="group">
                <label>Insira os produtos (1 por linha)</label>
                <p style="font-size: 11px; color: #a2a2c2; margin-top: -3px; margin-bottom: 5px;">Padrão: Nome do Produto | Inteiro | Centavos | Unidade</p>
                <textarea id="textarea-produtos" placeholder="Exemplo:&#10;COXÃO MOLE BOVINO KG|35|90|UNIDADE&#10;ARROZ INTEGRAL 5KG|24|50|PACOTE&#10;FEIJÃO CARIOCA 1KG|07|89|KG"></textarea>
            </div>
        </div>

        <div class="group">
            <label>Texto do Rodapé</label>
            <input type="text" id="input-rodape" value="IC ART'S">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Cartazes</button>
    </div>

    <!-- ÁREA DE PREVISÃO DA FOLHA -->
    <div class="main-content">
        <div class="print-zone" id="print-zone-container">
            <!-- Os cartazes gerados via código entrarão aqui dinamicamente -->
        </div>
    </div>

    <!-- SCRIPT DE GERENCIAMENTO (100% OFFLINE) -->
    <script>
        // Mapeamento dos elementos de entrada
        const selectTema = document.getElementById('select-tema');
        const selectFormato = document.getElementById('select-formato');
        const selectModo = document.getElementById('select-modo');
        const inputTitulo = document.getElementById('input-titulo');
        const inputInteiro = document.getElementById('input-inteiro');
        const inputCentavos = document.getElementById('input-centavos');
        const inputUnidade = document.getElementById('input-unidade');
        const textareaProdutos = document.getElementById('textarea-produtos');
        const inputRodape = document.getElementById('input-rodape');
        const printZoneContainer = document.getElementById('print-zone-container');

        // Alterna a exibição das configurações dependendo do modo selecionado
        function alternarModo() {
            if (selectModo.value === "unico") {
                document.getElementById('form-unico').style.display = "block";
                document.getElementById('form-lista').style.display = "none";
            } else {
                document.getElementById('form-unico').style.display = "none";
                document.getElementById('form-lista').style.display = "block";
            }
            gerarCartazes();
        }

        // Função responsável por construir o HTML de um cartaz
        function criarHtmlCartaz(titulo, inteiro, centavos, unidade, rodape, classeFormato, classeTema) {
            // Garante formatação correta de texto do cabeçalho
            let textoTopo = "OFERTA";
            if(classeTema === "tema-confira") textoTopo = "CONFIRA";
            if(classeTema === "tema-promocao-vermelho") textoTopo = "PROMOÇÃO";
            if(classeTema === "tema-hortifruti-verde") textoTopo = "HORTIFRUTI";
            if(classeTema === "tema-limpeza-azul-ceu") textoTopo = "LIMPEZA";

            return `
                <div class="paper-preview ${classeFormato} ${classeTema}">
                    <div class="cartaz-container">
                        <div class="faixa-topo">
                            <div class="badge-topo">${textoTopo}</div>
                        </div>
                        
                        <div class="conteudo-principal">
                            <div class="product-title">${titulo.toUpperCase()}</div>
                            
                            <div class="price-section">
                                <div class="price-main">
                                    <span class="inteiro">${inteiro}</span>
                                    <div class="centavos-box">
                                        <span class="centavos">${centavos}</span>
                                    </div>
                                </div>
                                <div class="unidade-medida">${unidade.toUpperCase()}</div>
                            </div>
                        </div>
                        
                        <div class="faixa-rodape">
                            <div class="texto-rodape">${rodape.toUpperCase()}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Renderiza as folhas de visualização na tela em tempo real
        function gerarCartazes() {
            printZoneContainer.innerHTML = ""; // Limpa a área de visualização anterior
            
            const formato = selectFormato.value;
            const tema = selectTema.value;
            const rodape = inputRodape.value;

            if (selectModo.value === "unico") {
                // Modo único gera apenas 1 cartaz na tela usando os inputs padrão
                const html = criarHtmlCartaz(
                    inputTitulo.value,
                    inputInteiro.value,
                    inputCentavos.value,
                    inputUnidade.value,
                    rodape,
                    formato,
                    tema
                );
                printZoneContainer.innerHTML = html;
            } else {
                // Modo lista varre as linhas digitadas na caixa de texto
                const linhas = textareaProdutos.value.split('\n');
                
                linhas.forEach(linha => {
                    if (linha.trim() !== "") {
                        // Divide as informações usando o caractere "|" pipe
                        const dados = linha.split('|');
                        const titulo = dados[0] ? dados[0].trim() : "PRODUTO";
                        const inteiro = dados[1] ? dados[1].trim() : "0";
                        const centavos = dados[2] ? dados[2].trim() : "00";
                        const unidade = dados[3] ? dados[3].trim() : "UNIDADE";

                        const html = criarHtmlCartaz(titulo, inteiro, centavos, unidade, rodape, formato, tema);
                        printZoneContainer.innerHTML += html;
                    }
                });
            }
        }

        // Listeners para atualizar os componentes assim que o usuário digita/muda as opções
        selectTema.addEventListener('change', gerarCartazes);
        selectFormato.addEventListener('change', gerarCartazes);
        inputTitulo.addEventListener('input', gerarCartazes);
        inputInteiro.addEventListener('input', gerarCartazes);
        inputCentavos.addEventListener('input', gerarCartazes);
        inputUnidade.addEventListener('input', gerarCartazes);
        textareaProdutos.addEventListener('input', gerarCartazes);
        inputRodape.addEventListener('input', gerarCartazes);

        // Inicializa gerando o primeiro cartaz base padrão na tela
        gerarCartazes();
    </script>
</body>
</html>
