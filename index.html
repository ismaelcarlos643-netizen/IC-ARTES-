<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cartazista Pro - IC ARTES</title>
    <style>
        /* CONFIGURAÇÕES DO PAINEL LATERAL (SaaS) */
        * { box-sizing: border-box; font-family: 'Arial Black', Gadget, sans-serif; }
        body { margin: 0; background-color: #1e1e2f; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } }
        
        .sidebar { width: 380px; background-color: #26263f; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.3); z-index: 10; font-family: system-ui, sans-serif; }
        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; overflow: visible; } }
        
        .main-content { flex: 1; background-color: #13131f; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; min-height: 100vh; }
        
        h2 { font-size: 18px; margin-top: 0; color: #00ffcc; border-bottom: 2px solid #3d3d5c; padding-bottom: 10px; font-family: system-ui, sans-serif; text-transform: uppercase; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a2a2c2; margin-bottom: 5px; font-weight: 600; font-family: system-ui, sans-serif; }
        input, select { width: 100%; padding: 10px; background-color: #31314f; border: 1px solid #4e4e75; border-radius: 6px; color: #fff; font-size: 15px; outline: none; font-family: system-ui, sans-serif; }
        input:focus, select:focus { border-color: #00ffcc; }
        .row { display: flex; gap: 10px; }
        
        .btn-print { background: linear-gradient(135deg, #00ffcc, #00b3ff); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 15px; text-transform: uppercase; }
        .btn-save { background: linear-gradient(135deg, #ffcc00, #ffaa00); color: #13131f; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 10px; text-transform: uppercase; }
        
        /* PREVISÃO DA FOLHA */
        .paper-preview { background-color: #fff; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* TAMANHOS DE PAPEL */
        .A4 { width: 210mm; height: 297mm; }
        .A5 { width: 148mm; height: 210mm; }
        .tam-11x15 { width: 110mm; height: 150mm; }
        .tam-20x27 { width: 200mm; height: 270mm; }

        /* MODO MULTI-CARTAZ 4 POR FOLHA */
        .grid-4 { width: 210mm; height: 297mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; background: #fff; }
        .grid-4 .cartaz-container { width: 100% !important; height: 100% !important; page-break-inside: avoid; border: 1px dashed #ccc !important; }
        
        /* CORES DO TEMA DO CARTAZ */
        .tema-vermelho { color: #e60000; }
        .tema-azul { color: #0044cc; }
        .tema-preto { color: #111111; }

        /* NOVO DESIGN DO CARTAZ */
        .cartaz-container { 
            width: 100%; 
            height: 100%; 
            background-color: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 0; 
            box-sizing: border-box; 
            position: relative; 
            overflow: hidden;
            border: 15px solid currentColor;
        }
        
        /* FAIXA DO TOPO ONDULADA */
        .faixa-topo {
            width: 100%;
            height: 18%;
            background-color: currentColor;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
        }
        .badge-topo { 
            font-size: 45px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #fff;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.4);
            text-align: center;
        }
        
        /* CONTEÚDO CENTRALIZADO SOBRE O FUNDO AMARELO PINCELADO */
        .conteudo-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 10px 20px;
            background: radial-gradient(circle, #ffe600 60%, #ffffff 100%);
        }

        .product-image-top { 
            height: 120px; 
            display: none;
            justify-content: center; 
            align-items: center; 
        }
        .product-image-top img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .product-title { 
            font-size: 42px; 
            font-weight: 900; 
            text-align: center; 
            text-transform: uppercase; 
            color: #000; 
            line-height: 1.0;
            margin: 5px 0;
            text-shadow: 1px 1px 0px #fff;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* SEÇÃO DE PREÇOS */
        .price-section { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
        }
        .price-old { font-size: 24px; color: #333; text-decoration: line-through; font-weight: bold; margin-bottom: -5px; display: none; }
        .price-main { color: currentColor; font-weight: 900; display: flex; align-items: flex-start; justify-content: center; line-height: 0.75; }
        .rs { font-size: 50px; margin-top: 25px; font-weight: 900; margin-right: 3px; }
        .inteiro { font-size: 190px; letter-spacing: -10px; }
        .centavos { font-size: 85px; margin-top: 25px; font-weight: 900; line-height: 0.7; margin-left: 2px; }
        .unidade-medida { font-size: 24px; color: #000; font-weight: 900; background-color: #fff; border: 2px solid #000; padding: 2px 10px; border-radius: 4px; margin-top: 5px; text-transform: uppercase; }
        
        .clube-tag { position: absolute; bottom: 25%; right: 15px; background-color: #000; color: #fff; padding: 8px 12px; font-weight: 900; border-radius: 4px; font-size: 14px; text-transform: uppercase; display: none; transform: rotate(-5deg); }

        /* FAIXA DO RODAPÉ */
        .faixa-rodape {
            width: 100%;
            height: 10%;
            background-color: currentColor;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0 20%, 50% 0, 100% 20%, 100% 100%, 0 100%);
            padding-top: 8px;
        }
        .texto-rodape {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* CONFIGURAÇÕES REDUZIDAS PARA O MODO LISTA (4 POR FOLHA) */
        .grid-4 .badge-topo { font-size: 22px; }
        .grid-4 .faixa-topo { height: 16%; }
        .grid-4 .product-image-top { height: 50px; }
        .grid-4 .product-title { font-size: 18px; margin: 2px 0; }
        .grid-4 .rs { font-size: 18px; margin-top: 8px; }
        .grid-4 .inteiro { font-size: 75px; letter-spacing: -4px; }
        .grid-4 .centavos { font-size: 35px; margin-top: 8px; }
        .grid-4 .unidade-medida { font-size: 11px; margin-top: 2px; padding: 1px 4px; }
        .grid-4 .price-old { font-size: 12px; }
        .grid-4 .clube-tag { font-size: 8px; bottom: 20%; }
        .grid-4 .texto-rodape { font-size: 10px; }
        .grid-4 .faixa-rodape { height: 9%; padding-top: 4px; }
        .grid-4 .cartaz-container { border-width: 6px; }

        /* REGRAS DE IMPRESSÃO */
        @media print {
            body { background: #fff; color: #000; display: block; height: auto; overflow: visible; }
            .sidebar { display: none; }
            .main-content { background: #fff; padding: 0; overflow: visible; display: block; }
            .paper-preview { box-shadow: none; page-break-after: always; margin: 0; border: none; }
            @page { margin: 0; }
        }
    </style>
</head>
<body>

    <!-- PAINEL LATERAL DE CONTROLE -->
    <div class="sidebar">
        <h2>IC ARTES - SISTEMA</h2>
        
        <div class="group">
            <label>Tipo de Cabeçalho / Tema</label>
            <select id="select-tema">
                <option value="tema-vermelho">OFERTA (Vermelho)</option>
                <option value="tema-azul">PROMOÇÃO (Azul)</option>
                <option value="tema-preto">ESPECIAL (Preto)</option>
            </select>
        </div>

        <div class="group">
            <label>Formato da Impressão</label>
            <select id="select-formato">
                <option value="A4">1 Cartaz Único por Folha A4</option>
                <option value="A5">1 Cartaz Único por Folha A5</option>
                <option value="tam-11x15">Tamanho Medio (11x15cm)</option>
                <option value="tam-20x27">Tamanho Grande (20x27cm)</option>
                <option value="grid-4">4 Cartazes por Folha A4 (Grid)</option>
            </select>
        </div>

        <div class="group">
            <label>Descrição do Produto</label>
            <input type="text" id="input-titulo" value="COXÃO MOLE BOVINO KG">
        </div>

        <div class="row">
            <div class="group" style="flex: 1;">
                <label>Preço "De" (Opcional)</label>
                <input type="text" id="input-preco-de" placeholder="Ex: 39,90">
            </div>
            <div class="group" style="flex: 1;">
                <label>Sócio Clube (Opcional)</label>
                <input type="text" id="input-clube" placeholder="Ex: No App">
            </div>
        </div>

        <div class="row">
            <div class="group" style="flex: 1.5;">
                <label>Preço Inteiro</label>
                <input type="text" id="input-inteiro" value="35">
            </div>
            <div class="group" style="flex: 1;">
                <label>Centavos</label>
                <input type="text" id="input-centavos" value="90">
            </div>
        </div>

        <div class="group">
            <label>Unidade de Medida Inferior</label>
            <input type="text" id="input-unidade" value="UNIDADE">
        </div>

        <div class="group">
            <label>Inserir Imagem do Produto?</label>
            <select id="select-imagem-opcao">
                <option value="nao">Não usar imagem</option>
                <option value="sim">Sim, carregar imagem</option>
            </select>
            <input type="file" id="input-arquivo-imagem" style="display: none; margin-top: 10px;" accept="image/*">
        </div>

        <button class="btn-print" onclick="window.print()">Imprimir Folha</button>
        <button class="btn-save" onclick="alert('Função de salvar integrada! Para salvar offline, use o comando Imprimir e mude o destino para Salvar como PDF.')">Salvar Imagem (WhatsApp)</button>
    </div>

    <!-- ÁREA DE PREVISÃO DA FOLHA -->
    <div class="main-content">
        <div id="wrapper-preview" class="paper-preview A4 tema-vermelho">
            
            <!-- Estrutura do Cartaz -->
            <div class="cartaz-container">
                <div class="faixa-topo">
                    <div class="badge-topo" id="view-topo">Oferta</div>
                </div>
                
                <div class="conteudo-principal">
                    <div class="product-image-top" id="view-imagem-bloco">
                        <img id="view-img" src="" alt="Produto">
                    </div>
                    
                    <div class="product-title" id="view-titulo">COXÃO MOLE BOVINO KG</div>
                    
                    <div class="price-section">
                        <div class="price-old" id="view-preco-de">De: R$ 0,00</div>
                        <div class="price-main">
                            <span class="rs">R$</span>
                            <span class="inteiro" id="view-inteiro">35</span>
                            <span class="centavos" id="view-centavos">,90</span>
                        </div>
                        <div class="unidade-medida" id="view-unidade">UNIDADE</div>
                    </div>
                    
                    <div class="clube-tag" id="view-clube">Clube</div>
                </div>
                
                <div class="faixa-rodape">
                    <div class="texto-rodape">Aproveite Já</div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT DE GERENCIAMENTO (100% OFFLINE) -->
    <script>
        const selectTema = document.getElementById('select-tema');
        const selectFormato = document.getElementById('select-formato');
        const inputTitulo = document.getElementById('input-titulo');
        const inputPrecoDe = document.getElementById('input-preco-de');
        const inputClube = document.getElementById('input-clube');
        const inputInteiro = document.getElementById('input-inteiro');
        const inputCentavos = document.getElementById('input-centavos');
        const inputUnidade = document.getElementById('input-unidade');
        const selectImgOpcao = document.getElementById('select-imagem-opcao');
        const inputArqImagem = document.getElementById('input-arquivo-imagem');

        const wrapperPreview = document.getElementById('wrapper-preview');
        const viewTopo = document.getElementById('view-topo');
        const viewTitulo = document.getElementById('view-titulo');
        const viewPrecoDe = document.getElementById('view-preco-de');
        const viewClube = document.getElementById('view-clube');
        const viewInteiro = document.getElementById('view-inteiro');
        const viewCentavos = document.getElementById('view-centavos');
        const viewUnidade = document.getElementById('view-unidade');
        const viewImgBloco = document.getElementById('view-imagem-bloco');
        const viewImg = document.getElementById('view-img');

        // Função de atualização em tempo real
        function atualizarCartaz() {
            // Atualiza Textos
            viewTitulo.innerText = inputTitulo.value.toUpperCase();
            viewInteiro.innerText = inputInteiro.value;
            viewCentavos.innerText = inputCentavos.value.startsWith(',') ? inputCentavos.value : ',' + inputCentavos.value;
            viewUnidade.innerText = inputUnidade.value.toUpperCase();

            // Gerencia Preço Antigo "De"
            if(inputPrecoDe.value.trim() !== "") {
                viewPrecoDe.innerText = "DE: R$ " + inputPrecoDe.value;
                viewPrecoDe.style.display = "block";
            } else {
                viewPrecoDe.style.display = "none";
            }

            // Gerencia Tag Clube
            if(inputClube.value.trim() !== "") {
                viewClube.innerText = inputClube.value.toUpperCase();
                viewClube.style.display = "block";
            } else {
                viewClube.style.display = "none";
            }

            // Mudar Texto do Cabeçalho baseado no tema
            if(selectTema.value === "tema-vermelho") viewTopo.innerText = "Oferta";
            if(selectTema.value === "tema-azul") viewTopo.innerText = "Promoção";
            if(selectTema.value === "tema-preto") viewTopo.innerText = "Especial";

            // Aplica as classes de Tema e Formato
            wrapperPreview.className = "paper-preview " + selectFormato.value + " " + selectTema.value;

            // Se for modo Multi-Cartaz (Grid 4) duplica a estrutura internamente para preencher o grid
            if(selectFormato.value === "grid-4") {
                if(!wrapperPreview.querySelector('.grid-4-reproducao')) {
                    const estruturaCartaz = wrapperPreview.innerHTML;
                    wrapperPreview.innerHTML = estruturaCartaz + estruturaCartaz + estruturaCartaz + estruturaCartaz;
                    // Adiciona uma marcação para não re-duplicar em loop
                    const itens = wrapperPreview.querySelectorAll('.cartaz-container');
                    itens.forEach(item => item.classList.add('grid-4-reproducao'));
                }
            }
        }

        // Eventos de digitação e alteração
        selectTema.addEventListener('change', atualizarCartaz);
        inputTitulo.addEventListener('input', atualizarCartaz);
        inputPrecoDe.addEventListener('input', atualizarCartaz);
        inputClube.addEventListener('input', atualizarCartaz);
        inputInteiro.addEventListener('input', atualizarCartaz);
        inputCentavos.addEventListener('input', atualizarCartaz);
        inputUnidade.addEventListener('input', atualizarCartaz);

        // Controla troca de formato limpando o grid se necessário
        selectFormato.addEventListener('change', () => {
            if(selectFormato.value !== "grid-4") {
                // Reseta para a estrutura de um único cartaz original
                wrapperPreview.innerHTML = `
                    <div class="cartaz-container">
                        <div class="faixa-topo"><div class="badge-topo" id="view-topo">Oferta</div></div>
                        <div class="conteudo-principal">
                            <div class="product-image-top" id="view-imagem-bloco"><img id="view-img" src="" alt="Produto"></div>
                            <div class="product-title" id="view-titulo"></div>
                            <div class="price-section">
                                <div class="price-old" id="view-preco-de"></div>
                                <div class="price-main">
                                    <span class="rs">R$</span>
                                    <span class="inteiro" id="view-inteiro"></span>
                                    <span class="centavos" id="view-centavos"></span>
                                </div>
                                <div class="unidade-medida" id="view-unidade"></div>
                            </div>
                            <div class="clube-tag" id="view-clube"></div>
                        </div>
                        <div class="faixa-rodape"><div class="texto-rodape">Aproveite Já</div></div>
                    </div>`;
                // Readquire referências dos novos elementos criados pelo innerHTML
                remapearElementos();
            }
            atualizarCartaz();
        });

        function remapearElementos() {
            window.viewTopo = document.getElementById('view-topo');
            window.viewTitulo = document.getElementById('view-titulo');
            window.viewPrecoDe = document.getElementById('view-preco-de');
            window.viewClube = document.getElementById('view-clube');
            window.viewInteiro = document.getElementById('view-inteiro');
            window.viewCentavos = document.getElementById('view-centavos');
            window.viewUnidade = document.getElementById('view-unidade');
            window.viewImgBloco = document.getElementById('view-imagem-bloco');
            window.viewImg = document.getElementById('view-img');
        }

        // Gerenciador de Upload de imagem local (Offline)
        selectImgOpcao.addEventListener('change', () => {
            if(selectImgOpcao.value === "sim") {
                inputArqImagem.style.display = "block";
            } else {
                inputArqImagem.style.display = "none";
                viewImgBloco.style.display = "none";
            }
        });

        inputArqImagem.addEventListener('change', function() {
